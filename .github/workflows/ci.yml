name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push makes an older run's answer moot, and macOS runners are few:
# the older run stops so the newer one starts at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (arm64)
    runs-on: macos-26
    # Build, tests and the release bundle. 45 cut the first run with a kept
    # build off a minute after its cold release build (2026-10-26).
    timeout-minutes: 70
    steps:
      # Everything but queue/audits: 3.8 GB of audit pictures nothing here
      # reads, and fetching them was three of every run's minutes (2026-10-26).
      # A sparse checkout fetches only the blobs it writes out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/queue/audits/
          sparse-checkout-cone-mode: false

      # The build folder is kept between runs (see "Keep the build"), and a
      # fresh checkout's file times would make it rebuild everything anyway.
      - name: File times from file contents
        run: Scripts/ci-stable-mtimes.sh

      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "cores: $(sysctl -n hw.activecpu)"
          echo "id=$( (xcodebuild -version; swift --version) 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Restored from the newest run of main on the same toolchain; only what
      # changed since then compiles. Saved again at the end of every run on main.
      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      # queue/playtest.lock says "a person is playtesting on THIS machine", so it
      # is only ever true where it was made. Committed on 2026-08-23, it rode the
      # repo onto the build machine and made every run refuse to build the app
      # until 2026-09-13. .gitignore keeps it out; this says so out loud, because
      # a `git add -f` would otherwise bring the outage back silently.
      - name: No machine-local files are committed
        run: |
          if git ls-files --error-unmatch queue/playtest.lock >/dev/null 2>&1; then
            echo "::error::queue/playtest.lock is tracked. It is machine-local:" \
                 "run 'git rm --cached queue/playtest.lock' — it is already in .gitignore."
            exit 1
          fi
          echo "queue/playtest.lock is not tracked."

      # Eleven files tell whoever is working here how big the walk sweep is, and
      # that number is the whole reason a task runner may not start one. Typed
      # in by hand it went stale: on 2026-09-19 every one of them still said 322
      # walks and 52 minutes while the set had grown to 532 and a full run to an
      # hour and three quarters. It is counted now, and this is what stops the
      # next hundred walks making them wrong again in silence.
      - name: The sweep's size is the size it really is
        run: |
          node queue/bin/sweep-size.mjs
          node queue/bin/sweep-size.mjs --check
          node queue/bin/sweep-size-drill.mjs

      # The sweep is the only thing that says whether what the loop just built
      # broke the app, and on 2026-09-18 a killed loop threw away 126 walk
      # answers AND the request that asked for them, so nothing checked the app
      # for a day. These hold the reading of a run and the picking-up of a
      # killed one honest.
      - name: A sweep that is cut short still counts
        run: |
          node queue/bin/sweep-parse-drill.mjs
          node queue/bin/sweep-interrupt-drill.mjs

      # And a run that was STOPPED is finished, not started again: on
      # 2026-10-22 a whole-set run reached 989 of 1011 walks in five hours and
      # was put down when the user came back, and the next was due to start
      # again at walk one. This holds the remainder, the merge into one run of
      # the set, and the standing task reading it honest, end to end.
      - name: A stopped sweep picks up where it stopped
        run: node queue/bin/sweep-resume-drill.mjs

      # And a sweep that loses the app part way through says the run went blind
      # rather than writing down every walk after that point as broken. One did
      # on 2026-09-21: 438 of 553 named as failing, on code that had passed 537
      # of 544 that morning, and the loop sent runners at that list for a day.
      - name: A sweep that goes blind says so
        run: node queue/bin/sweep-blind-drill.mjs

      # --disable-index-store everywhere: nothing here reads the index, it is
      # a gigabyte of the build folder, and a build with it and one without
      # are different builds, so every step passes the same flags.
      - name: Build (all targets and tests)
        run: swift build --build-tests $PHOTONZ_BUILD_FLAGS
        env:
          PHOTONZ_BUILD_FLAGS: --disable-index-store

      - name: Run tests
        # In parallel, at most three quarters of the cores at once
        # (Scripts/test.sh): the old --no-parallel dates from before
        # RecogniserLane, when a full pool of text reads wedged the VM, and it
        # made the run 39 minutes of one test after another (v0.19.0). The
        # first parallel run, before the slow suites were cut, reached 99 per
        # cent of the suite in 25 minutes (2026-10-26).
        timeout-minutes: 35
        env:
          PHOTONZ_BUILD_FLAGS: --disable-index-store
          # Timings are collected here, never gated, as in release.yml. Every
          # commit already gates them on the Mac the app is built on
          # (Scripts/test.sh before every commit), and on this three core VM,
          # two tests at a time, flat budgets failed on unchanged code: a
          # Width drag at 61.9 ms against 48, a long timeline at 204 ms
          # against 150 (2026-10-26).
          PHOTONZ_PERF_GATE: report
        run: Scripts/test.sh

      # --release, not the bare default. The default variant is the DEV bundle,
      # which meant this step built "dist/Photonz Dev.app" while the upload
      # below asked for dist/Photonz.app and quietly got nothing.
      - name: Build release app bundle
        run: Scripts/build-app.sh --release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photonz.app
          path: dist/Photonz.app
          if-no-files-found: error
          retention-days: 7

      # Only main's runs are kept: a pull request reads them and never writes.
      - name: Keep the build
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
