name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The loop pushes to main about 30 times a day, often faster than a run
# finishes. A newer push makes the older run's answer moot, so it is cancelled
# rather than billed: 330 of 997 runs in 2026-09-13..10-13 started while the
# one before was still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS minutes bill at 10x Linux. Nearly half the loop's commits touch only
  # queue/ records, docs or markdown, and building the app for those proves
  # nothing new, so this decides whether the macOS job runs at all. It fails
  # open: anything it cannot work out means "run it".
  changes:
    name: Does the app need building
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app=true
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] &&
             files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename'); then
            # compare lists at most 300 files; past that, assume code changed.
            if (( $(printf '%s\n' "$files" | grep -c .) < 300 )); then
              # queue/bin is code: FlagDefaultsReaderTests runs its scripts.
              code=$( { printf '%s\n' "$files" | grep -Ev '^docs/|^queue/|\.md$'
                        printf '%s\n' "$files" | grep -E '^queue/bin/'; } || true)
              [[ -z "$code" ]] && app=false
              printf 'Changed:\n%s\n\nApp-relevant:\n%s\n' "$files" "${code:-(none)}"
            fi
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  # The queue's own checks are plain Node, so they run on Linux, on every push.
  # Each step runs even when one before it failed, so each says its own answer.
  queue:
    name: Queue checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # queue/audits is ~3 GB of screenshots nothing in CI reads; skipping it
      # took checkout from over two minutes to seconds.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/queue/audits/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # queue/playtest.lock says "a person is playtesting on THIS machine", so it
      # is only ever true where it was made. Committed on 2026-08-23, it rode the
      # repo onto the build machine and made every run refuse to build the app
      # until 2026-09-13. .gitignore keeps it out; this says so out loud, because
      # a `git add -f` would otherwise bring the outage back silently.
      - name: No machine-local files are committed
        run: |
          if git ls-files --error-unmatch queue/playtest.lock >/dev/null 2>&1; then
            echo "::error::queue/playtest.lock is tracked. It is machine-local:" \
                 "run 'git rm --cached queue/playtest.lock' — it is already in .gitignore."
            exit 1
          fi
          echo "queue/playtest.lock is not tracked."

      # Eleven files tell whoever is working here how big the walk sweep is, and
      # that number is the whole reason a task runner may not start one. Typed
      # in by hand it went stale: on 2026-09-19 every one of them still said 322
      # walks and 52 minutes while the set had grown to 532 and a full run to an
      # hour and three quarters. It is counted now, and this is what stops the
      # next hundred walks making them wrong again in silence.
      - name: The sweep's size is the size it really is
        if: ${{ !cancelled() }}
        run: |
          node queue/bin/sweep-size.mjs
          node queue/bin/sweep-size.mjs --check
          node queue/bin/sweep-size-drill.mjs

      # The sweep is the only thing that says whether what the loop just built
      # broke the app, and on 2026-09-18 a killed loop threw away 126 walk
      # answers AND the request that asked for them, so nothing checked the app
      # for a day. These hold the reading of a run and the picking-up of a
      # killed one honest.
      - name: A sweep that is cut short still counts
        if: ${{ !cancelled() }}
        run: |
          node queue/bin/sweep-parse-drill.mjs
          node queue/bin/sweep-interrupt-drill.mjs

      # And a sweep that loses the app part way through says the run went blind
      # rather than writing down every walk after that point as broken. One did
      # on 2026-09-21: 438 of 553 named as failing, on code that had passed 537
      # of 544 that morning, and the loop sent runners at that list for a day.
      - name: A sweep that goes blind says so
        if: ${{ !cancelled() }}
        run: node queue/bin/sweep-blind-drill.mjs

  test:
    name: Build & test (arm64)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/queue/audits/

      - name: Swift version
        run: swift --version

      - name: Build (all targets)
        run: swift build

      - name: Run tests
        # 40, not 12: by 2026-10 the suite is ~10,800 tests and the runner
        # compiles the test targets inside this step. Every CI run from
        # 2026-09-17 to 2026-10-04 hit 12 minutes at a different test (about
        # 9,900 passed), so the step was out of time, not wedged.
        timeout-minutes: 40
        # --no-parallel: swift-testing otherwise launches every test concurrently;
        # the GPU-bound render tests then saturate the cooperative thread pool on
        # the headless CI VM and the whole process wedges. Serial is ~seconds here.
        run: Scripts/test.sh --no-parallel

      # Built, not uploaded: nothing downloads it and release.yml builds its own.
      # --release, not the bare default. The default variant is the DEV bundle,
      # which meant this step built "dist/Photonz Dev.app" while the upload
      # below asked for dist/Photonz.app and quietly got nothing.
      - name: Build release app bundle
        run: Scripts/build-app.sh --release
