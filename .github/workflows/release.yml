name: Release

on:
  push:
    tags: ["v*"]
  # By hand, for a tag that already exists: `gh workflow run release.yml -f
  # tag=vX.Y.Z -f skip_tests=true`. Skipping the tests is for re-running a
  # release whose code has already been tested and only the packaging failed
  # or the suite ran out of time on a slow runner (v0.19.0, 2026-10-26). A
  # tag push always runs them.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.19.0"
        required: true
        type: string
      skip_tests:
        description: "Skip the test step"
        required: false
        type: boolean
        default: false
      # Everything a release does but publish, on any ref, to time it:
      # `gh workflow run release.yml -f tag=main -f dry_run=true`.
      dry_run:
        description: "Build, test, sign and package, but publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The tests, as three slices on three runners at once, as in ci.yml
  # (Scripts/test.sh --shard). One runner took 53 minutes of v0.19.0's run
  # one test at a time, and timed out at 65 on the next (2026-10-26).
  test:
    name: Test slice ${{ matrix.slice }} of 3
    if: ${{ !inputs.skip_tests }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        slice: [1, 2, 3]
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Collect the render timings, never gate on them. v0.15.0 failed to
      # publish twice on a shared runner that was four to eight times slower
      # than the machine the app is developed on, with nothing actually slower
      # in the app. By the time a tag exists, that code has already been
      # through them on the Mac it is built on, and a stopwatch reading on
      # hired hardware is not a reason to hold a release.
      PHOTONZ_PERF_GATE: report
      PHOTONZ_BUILD_FLAGS: --disable-index-store
    steps:
      # Everything but queue/audits, as in ci.yml: 3.8 GB of pictures nothing
      # here reads.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            /*
            !/queue/audits/
          sparse-checkout-cone-mode: false

      # Restores the newest build main's CI kept (debug and release), so only
      # what changed since compiles. See Scripts/ci-stable-mtimes.sh for why
      # the file times are set first. A tag never saves: its cache could only
      # ever be read by the same tag.
      - name: File times from file contents
        run: Scripts/ci-stable-mtimes.sh

      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "cores: $(sysctl -n hw.activecpu)"
          echo "id=$( (xcodebuild -version; swift --version) 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Build (all targets and tests)
        run: swift build --build-tests $PHOTONZ_BUILD_FLAGS

      - name: Run tests
        timeout-minutes: 25
        run: Scripts/test.sh --shard ${{ matrix.slice }}/3

  # Builds, signs, notarizes and packages the DMG while the tests run; the
  # release is published only once both are through (publish, below).
  package:
    name: Build, sign & package
    runs-on: macos-26
    # Generous: Apple's notary service is usually minutes but can crawl for
    # 30+ min during slow stretches; don't let the job cancel a good build.
    timeout-minutes: 90
    env:
      # True once the Apple Developer secrets are configured; every signing/
      # notarization step keys off this so the pipeline still works (ad-hoc)
      # without them. Required secrets:
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
      #   APPLE_CERTIFICATE_P12       base64 of the .p12 (cert + private key)
      #   APPLE_CERTIFICATE_PASSWORD  password for the .p12
      #   APPLE_ID                    Apple ID email for notarytool
      #   APPLE_TEAM_ID               10-char team id
      #   APPLE_APP_PASSWORD          app-specific password for notarytool
      HAVE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      # The tag being released: the pushed tag, or the one named by hand.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Everything but queue/audits, as in ci.yml: 3.8 GB of pictures nothing
      # here reads.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            /*
            !/queue/audits/
          sparse-checkout-cone-mode: false

      # Restores the newest build main's CI kept (debug and release), so only
      # what changed since compiles. See Scripts/ci-stable-mtimes.sh for why
      # the file times are set first. A tag never saves: its cache could only
      # ever be read by the same tag.
      - name: File times from file contents
        run: Scripts/ci-stable-mtimes.sh

      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "cores: $(sysctl -n hw.activecpu)"
          echo "id=$( (xcodebuild -version; swift --version) 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Verify tag matches VERSION
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${RELEASE_TAG#v}"
          FILE="$(cat VERSION)"
          if [[ "$TAG" != "$FILE" ]]; then
            echo "Tag v$TAG does not match VERSION file ($FILE)" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          # Empty when unsigned: build-app.sh falls back to ad-hoc signing.
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # --release is not optional here even though an identity usually implies
        # it: with the secret unset, the bare script builds the DEV bundle, and
        # every step after this one asks for dist/Photonz.app and finds nothing.
        run: Scripts/build-app.sh --release

      # build-app.sh already refuses a release bundle without the microphone
      # entitlement; this checks the exact bundle that is about to be
      # notarized and published, so a later change to the build cannot ship
      # another v0.17.0 (hardened runtime, no entitlement: macOS refused the
      # microphone without a prompt and never listed the app in Settings).
      - name: Verify the app may use the microphone
        run: Scripts/check-entitlements.sh dist/Photonz.app

      # Two-submission flow so BOTH artifacts carry tickets: notarize + staple
      # the app first (a stapled bundle in /Applications launches clean even
      # fully offline), then build the DMG from the stapled app and notarize +
      # staple that too. Best-effort: the build is already Developer ID
      # signed; if Apple's notary service won't cooperate after retries we
      # publish the signed build anyway rather than block the release.
      - name: Notarize & staple the app (best-effort)
        if: env.HAVE_SIGNING == 'true'
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if Scripts/notarize.sh dist/Photonz.app; then
            echo "APP_NOTARIZED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::App notarization did not complete after retries; publishing the signed-but-unnotarized build."
          fi

      - name: Package DMG
        run: Scripts/build-app.sh --dmg-only

      - name: Notarize & staple the DMG (best-effort)
        if: env.APP_NOTARIZED == '1'
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if ! Scripts/notarize.sh dist/Photonz.dmg; then
            echo "::warning::DMG notarization did not complete; the stapled app inside still validates."
          fi

      - name: Keep the DMG for publishing
        uses: actions/upload-artifact@v4
        with:
          name: Photonz.dmg
          path: dist/Photonz.dmg
          if-no-files-found: error
          retention-days: 7

  # Published only when the package is built and every test slice passed (or
  # the tests were skipped by hand). A Linux runner: it only uploads.
  publish:
    name: Publish
    needs: [test, package]
    if: ${{ always() && !inputs.dry_run && needs.package.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            VERSION
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Fetch the DMG
        uses: actions/download-artifact@v4
        with:
          name: Photonz.dmg
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="$(cat VERSION)"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "No CHANGELOG section for $VERSION" > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Photonz $RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            dist/Photonz.dmg
