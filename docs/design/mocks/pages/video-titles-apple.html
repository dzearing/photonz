<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photonz · video-titles-apple</title>
<link rel="stylesheet" href="/shared/photonz-ds.css">
<style>
/* video-titles-apple · ten title pages, each a close study of one named
   reference (Apple keynotes, product films, WWDC, Apple Events, Stripe
   Sessions, Linear). Every design is a 1920x1080 frame driven by ONE
   deterministic timeline (tpFrame), so any moment can be photographed and laid
   beside the app's render of the same moment:
     ?shot=<design id>&t=<ms>   one frame, unscaled, paused (for capture)
     ?open=<design id>          opens that design in the player
   Each part is written in the app's own title vocabulary (role, build kind,
   delay, length, amount) so the build is a transcription, not a guess.
   Every local class carries the tp- prefix (AGENTS.md). */

#video-titles-apple{
  --tp-sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,sans-serif;
  --tp-sft:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,sans-serif;
  --tp-ny:"New York","New York Large","NewYork",ui-serif,Georgia,serif;
}
#video-titles-apple .tp-intro{max-width:760px;color:var(--fg2,#a1a1a6);font-size:13px;line-height:1.5;margin:0 0 var(--s5,20px)}
#video-titles-apple .tp-bar{display:flex;gap:8px;align-items:center;margin:0 0 var(--s5,20px)}
#video-titles-apple .tp-btn{appearance:none;border:1px solid rgba(127,127,127,.28);background:rgba(127,127,127,.1);
  color:inherit;font:inherit;font-size:12px;font-weight:550;padding:5px 12px;border-radius:7px;cursor:pointer}
#video-titles-apple .tp-btn:hover{background:rgba(127,127,127,.18)}
#video-titles-apple .tp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
@media (max-width:1100px){#video-titles-apple .tp-grid{grid-template-columns:1fr}}
#video-titles-apple .tp-card{margin:0;cursor:pointer}
#video-titles-apple .tp-vp{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(127,127,127,.22),0 10px 30px rgba(0,0,0,.28);background:#000}
#video-titles-apple .tp-card:hover .tp-vp{box-shadow:0 0 0 2px var(--accent,#0a84ff),0 10px 30px rgba(0,0,0,.28)}
#video-titles-apple .tp-cap{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 2px 0}
#video-titles-apple .tp-num{font-size:12px;font-weight:650;color:var(--fg3,#86868b);font-variant-numeric:tabular-nums;grid-row:span 3;padding-top:1px}
#video-titles-apple .tp-name{font-size:14px;font-weight:650}
#video-titles-apple .tp-ref{font-size:12px;color:var(--fg2,#a1a1a6)}
#video-titles-apple .tp-why{font-size:12px;color:var(--fg3,#86868b);line-height:1.45}

/* ---------- the 1920x1080 frame ---------- */
.tp-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-kerning:normal;font-optical-sizing:auto;font-family:var(--tp-sf)}
.tp-stage .tp-bg{position:absolute;inset:0}
.tp-stage .tp-p{position:absolute;will-change:transform,opacity,filter;white-space:nowrap}
.tp-stage .tp-ln{display:block;overflow:hidden;padding:0 .04em .14em;margin:0 -.04em -.14em}
.tp-stage .tp-ln>span{display:inline-block;will-change:transform}
.tp-stage .tp-rule{position:absolute;transform-origin:0 50%}

/* ---------- the player ---------- */
.tp-dlg{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tp-dlg.on{display:grid;grid-template-rows:1fr auto;padding:28px 40px 20px;gap:14px}
.tp-dlg .tp-dvp{position:relative;align-self:center;justify-self:center;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.6);background:#000}
.tp-dlg .tp-ctl{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:12px;align-items:center;color:#f5f5f7;
  font-size:12px;max-width:1400px;width:100%;justify-self:center}
.tp-dlg .tp-ctl b{font-weight:650}
.tp-dlg .tp-time{font-variant-numeric:tabular-nums;color:#a1a1a6;min-width:120px;text-align:right}
.tp-dlg .tp-scrub{position:relative;height:28px;cursor:pointer}
.tp-dlg .tp-track{position:absolute;left:0;right:0;top:13px;height:2px;background:rgba(255,255,255,.18);border-radius:1px}
.tp-dlg .tp-seg{position:absolute;top:11px;height:6px;border-radius:3px}
.tp-dlg .tp-seg.in{background:rgba(10,132,255,.55)}
.tp-dlg .tp-seg.out{background:rgba(255,159,10,.5)}
.tp-dlg .tp-mk{position:absolute;top:6px;width:1px;height:16px;background:rgba(255,255,255,.45)}
.tp-dlg .tp-mk i{position:absolute;top:18px;left:-20px;width:40px;text-align:center;font-style:normal;font-size:9px;color:#8e8e93}
.tp-dlg .tp-head{position:absolute;top:2px;width:2px;height:24px;margin-left:-1px;background:#fff;border-radius:1px}
.tp-dlg .tp-spec{max-width:1400px;width:100%;justify-self:center;color:#d1d1d6;font-size:11px;line-height:1.5;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 24px;max-height:150px;overflow:auto}
.tp-dlg .tp-spec div b{color:#fff;font-weight:600}
.tp-dlg .tp-x{position:absolute;right:16px;top:12px}
.tp-dlg .tp-btn{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#f5f5f7;
  font:inherit;font-size:12px;font-weight:550;padding:5px 12px;border-radius:7px;cursor:pointer}
.tp-dlg .tp-btn:hover{background:rgba(255,255,255,.18)}

/* ---------- capture mode: one frame, unscaled ---------- */
body.tp-shot{margin:0;background:#000;overflow:hidden}
body.tp-shot .tp-stage{transform:none}
</style>
</head>

    </div>
  </section>
</main>

   Curves. Landings are a soft exponential ease out; leaving is a short
   sine in-out. Opacity reaches full a little before the travel settles,
   which is what makes a move read as calm rather than late.
   ============================================================ */
const C = {
  expoOut: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  quintOut: p => 1 - Math.pow(1 - p, 5),
  cubicOut: p => 1 - Math.pow(1 - p, 3),
  sineInOut: p => -(Math.cos(Math.PI * p) - 1) / 2,
  linear: p => p,
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

      out: { delay: 0, len: 450 } },
    { id: 's', role: 'subtitle', build: 'Fade', text: 'Free on the Mac',
      css: 'left:0;right:0;top:594px;text-align:center;font-size:36px;line-height:1.2;font-weight:400;letter-spacing:-0.004em;color:#6e6e73',
      type: 'SF Pro Text Regular 36 · #6E6E73',
      in: { delay: 400, len: 800, curve: 'sineInOut', opacityOnly: true },
      out: { delay: 0, len: 400 } },
  ],
},
];

/* timings every design shares */
DESIGNS.forEach(d => {
  d.inEnd = Math.max(...d.parts.map(p => p.in.delay + p.in.len + (p.in.stagger || 0) * (lineCount(p) - 1)));
  d.outStart = d.inEnd + HOLD;
  d.outEnd = d.outStart + Math.max(...d.parts.map(p => p.out.delay + p.out.len));
  d.loop = d.outEnd + GAP;
});
function lineCount(p) { return p.text ? p.text.split('\n').length : 1; }

/* ============================================================
   Build one stage
   ============================================================ */
function buildStage(d) {
  const st = document.createElement('div');
  st.className = 'tp-stage';
  const bg = document.createElement('div');
  bg.className = 'tp-bg';
  bg.style.background = d.bg;
  st.appendChild(bg);
  if (d.glow) {
    const g = document.createElement('div');
    g.style.cssText = 'position:absolute;left:0;top:0;' + d.glow.css;
    g.dataset.glow = '1';
    st.appendChild(g);
  }
  d.parts.forEach(p => {
    const el = document.createElement('div');
    el.className = p.rule ? 'tp-rule' : 'tp-p';
    el.style.cssText = p.css;
    el.dataset.part = p.id;
    if (!p.rule) {
      p.text.split('\n').forEach((line, i) => {
        const ln = document.createElement('span');
        ln.className = 'tp-ln';
        const inner = document.createElement('span');
        inner.textContent = line;
        if (p.lineColors && p.lineColors[i]) inner.style.color = p.lineColors[i];
        if (p.fill) {
          inner.style.backgroundImage = p.fill;
          if (p.fillSize) inner.style.backgroundSize = p.fillSize;
          inner.style.webkitBackgroundClip = 'text'; inner.style.backgroundClip = 'text';
          inner.style.webkitTextFillColor = 'transparent';
        }
        ln.appendChild(inner);
        el.appendChild(ln);
      });
      /* a mask reveal clips each line; everything else draws its lines unclipped */
      if (!p.in.mask) el.querySelectorAll('.tp-ln').forEach(l => { l.style.overflow = 'visible'; });
    }
    st.appendChild(el);
  });
  return st;
}

/* ============================================================
   The one function that says what the frame looks like at time t.
   ============================================================ */
function tpFrame(st, d, t) {
  const g = st.querySelector('[data-glow]');
  if (g) {
    const a = (t / d.glow.period) * Math.PI * 2;
    g.style.transform = `translate(${d.glow.x + Math.sin(a) * d.glow.dx}px,${d.glow.y + Math.cos(a) * d.glow.dy}px)`;
  }
  d.parts.forEach(p => {
    const el = st.querySelector(`[data-part="${p.id}"]`);
    const I = p.in, O = p.out, curve = C[I.curve || 'expoOut'];
    const qo = C.sineInOut(clamp((t - d.outStart - O.delay) / O.len));
    const outOpacity = 1 - qo, outBlur = (O.blur || 0) * qo, outRise = (O.rise || 0) * qo;

    const lines = el.querySelectorAll('.tp-ln>span');
    const perLine = I.mask || I.lines;
    const raw0 = clamp((t - I.delay) / I.len);
    const e0 = curve(raw0);
    /* opacity is full at 60% of the build; the travel keeps settling after */
    const op0 = I.opacityOnly ? curve(raw0) : C.cubicOut(clamp(raw0 / 0.6));

    if (perLine) {
      lines.forEach((sp, i) => {
        const raw = clamp((t - I.delay - i * (I.stagger || 0)) / I.len);
        const e = curve(raw);
        if (I.mask) {
          sp.style.transform = `translateY(${(1 - e) * 112}%)`;
        } else {
          const op = C.cubicOut(clamp(raw / 0.6));
          sp.style.transform = `translateY(${(I.rise || 0) * (1 - e)}px)`;
          sp.style.opacity = op;
          sp.style.filter = I.blur ? `blur(${(I.blur * (1 - e)).toFixed(2)}px)` : '';
        }
      });
      el.style.opacity = outOpacity;
      el.style.transform = `translateY(${-outRise}px)`;
      el.style.filter = outBlur ? `blur(${outBlur.toFixed(2)}px)` : '';
      return;
    }

    if (p.rule) {
      el.style.transform = `scaleX(${I.draw ? e0 : 1})`;
      el.style.opacity = (I.draw ? 1 : op0) * outOpacity * (raw0 > 0 ? 1 : 0);
      return;
    }

    const rise = (I.rise || 0) * (1 - e0) - outRise;
    const sc = I.scale ? lerp(I.scale, 1, e0) : 1;
    const blur = (I.blur || 0) * (1 - e0) + outBlur;
    el.style.opacity = op0 * outOpacity;
    el.style.transform = `translateY(${rise.toFixed(2)}px) scale(${sc.toFixed(4)})`;
    el.style.filter = blur > 0.01 ? `blur(${blur.toFixed(2)}px)` : '';
    if (I.track) el.style.letterSpacing = lerp(I.track[0], I.track[1], e0).toFixed(4) + 'em';
    if (I.sweep) {
      const s = C.cubicOut(clamp((t - I.delay) / I.sweep));
      el.querySelectorAll('.tp-ln>span').forEach(sp => { sp.style.backgroundPosition = `${lerp(100, 0, s).toFixed(2)}% 50%`; });
    }
  });
}

/* ============================================================
   Capture mode
   ============================================================ */
const q = new URLSearchParams(location.search);
if (q.has('shot')) {
  const d = DESIGNS.find(x => x.id === q.get('shot')) || DESIGNS[0];
  document.body.className = 'tp-shot';
  document.body.innerHTML = '';
  const host = document.createElement('div');
  host.id = 'video-titles-apple';
  const st = buildStage(d);
  host.appendChild(st);
  document.body.appendChild(host);
  window.tpDesigns = DESIGNS;
  window.tpSeek = (id, t) => {
    const dd = DESIGNS.find(x => x.id === id);
    if (dd !== d) { host.innerHTML = ''; const s2 = buildStage(dd); host.appendChild(s2); tpFrame(s2, dd, t); window.__d = dd; return; }
    tpFrame(host.firstChild, dd, t);
  };
  tpFrame(st, d, +(q.get('t') || 0));
  return;
}

/* ============================================================
   The grid: every card loops on its own clock while it is on screen.
   ============================================================ */
const grid = document.getElementById('tp-grid');
const cards = DESIGNS.map((d, i) => {
  const fig = document.createElement('figure');
  fig.className = 'tp-card';
  fig.tabIndex = 0;
  const vp = document.createElement('div');
  vp.className = 'tp-vp';
  const st = buildStage(d);
  vp.appendChild(st);
  const cap = document.createElement('figcaption');
  cap.className = 'tp-cap';
  cap.innerHTML = `<span class="tp-num">${String(i + 1).padStart(2, '0')}</span><span class="tp-name"></span><span class="tp-ref"></span><span class="tp-why"></span>`;
  cap.querySelector('.tp-name').textContent = d.name;
  cap.querySelector('.tp-ref').textContent = 'Study of: ' + d.ref;
  cap.querySelector('.tp-why').textContent = d.why;
  fig.append(vp, cap);
  grid.appendChild(fig);
  const card = { d, vp, st, t0: performance.now() - i * 260, visible: true };
  fig.addEventListener('click', () => openPlayer(d));
  fig.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlayer(d); } });
  return card;
});

function fit(vp, st) { st.style.transform = `scale(${vp.clientWidth / 1920})`; }
const ro = new ResizeObserver(() => { cards.forEach(c => fit(c.vp, c.st)); if (P.d) fit(P.vp, P.st); });
cards.forEach(c => ro.observe(c.vp));
const io = new IntersectionObserver(es => es.forEach(e => {
  const c = cards.find(k => k.vp === e.target); if (c) c.visible = e.isIntersecting;
}));
cards.forEach(c => io.observe(c.vp));
document.getElementById('tp-replay').addEventListener('click', () => {
  const now = performance.now(); cards.forEach((c, i) => { c.t0 = now - i * 120; });
});

/* ============================================================
   The player: scrub, step, and read the spec.
   ============================================================ */
const dlg = document.getElementById('tp-dlg');
/* the shell's screen is a containing block for fixed boxes, so the player lives on the body */
document.body.appendChild(dlg);
const P = { d: null, st: null, vp: document.getElementById('tp-dvp'), t: 0, playing: true, last: 0 };
ro.observe(P.vp);
function sizePlayer() {
  const w = Math.min(window.innerWidth - 80, (window.innerHeight - 260) * 16 / 9, 1440);
  P.vp.style.width = w + 'px'; P.vp.style.height = (w * 9 / 16) + 'px';
  if (P.st) fit(P.vp, P.st);
}
function openPlayer(d) {
  P.d = d; P.t = 0; P.playing = true;
  P.vp.innerHTML = ''; P.st = buildStage(d); P.vp.appendChild(P.st);
  document.getElementById('tp-dname').textContent = d.name;
  document.getElementById('tp-dref').textContent = d.ref.replace(/ \(.*\)$/, '');
  const sc = document.getElementById('tp-scrub');
  sc.querySelectorAll('.tp-seg,.tp-mk').forEach(n => n.remove());
  const pct = ms => (ms / d.loop * 100) + '%';
  const seg = (cls, a, b) => { const s = document.createElement('div'); s.className = 'tp-seg ' + cls; s.style.left = pct(a); s.style.width = pct(b - a); sc.appendChild(s); };
  seg('in', 0, d.inEnd); seg('out', d.outStart, d.outEnd);
  [[0, '0'], [d.inEnd * .25, '25%'], [d.inEnd * .5, '50%'], [d.inEnd, 'in'], [d.inEnd + HOLD / 2, 'hold'], [d.outEnd, 'out']].forEach(([ms, label]) => {
    const m = document.createElement('div'); m.className = 'tp-mk'; m.style.left = pct(ms);
    m.innerHTML = `<i>${label}</i>`; m.dataset.ms = ms; sc.appendChild(m);
  });
  if (!sc.querySelector('.tp-head')) { const h = document.createElement('div'); h.className = 'tp-head'; sc.appendChild(h); }
  const spec = document.getElementById('tp-spec');
  spec.innerHTML = '';
  d.parts.forEach(p => {
    const I = p.in;
    const bits = [`${p.build}`, `delay ${I.delay}`, `${I.len} ms`];
    if (I.rise) bits.push(`rise ${I.rise}`);
    if (I.blur) bits.push(`blur ${I.blur}`);
    if (I.scale) bits.push(`scale from ${Math.round(I.scale * 100)}%`);
    if (I.stagger) bits.push(`${I.stagger} ms per line`);
    bits.push(I.curve === 'expoOut' ? 'expo out' : I.curve === 'sineInOut' ? 'sine in out' : 'cubic out');
    const row = document.createElement('div');
    row.innerHTML = `<b></b> <span class="a"></span><br><span class="b"></span><br><span class="c" style="color:#8e8e93"></span>`;
    row.querySelector('b').textContent = p.role[0].toUpperCase() + p.role.slice(1);
    row.querySelector('.a').textContent = p.text ? `"${p.text.replace('\n', ' / ')}"` : '';
    row.querySelector('.b').textContent = p.type;
    row.querySelector('.c').textContent = `In: ${bits.join(', ')} · Out: ${p.out.len} ms${p.out.blur ? ', blur ' + p.out.blur : ''}`;
    spec.appendChild(row);
  });
  const bgRow = document.createElement('div');
  bgRow.innerHTML = '<b>Background</b><br><span></span>';
  bgRow.querySelector('span').textContent = d.glow ? 'Navy #0A2540, one violet glow drifting 60 px over 14 s' : 'Still, ' + (d.bg.startsWith('#') ? d.bg.toUpperCase() : 'a fixed gradient');
  spec.appendChild(bgRow);
  dlg.classList.add('on');
  sizePlayer();
  document.getElementById('tp-play').textContent = 'Pause';
  history.replaceState(null, '', '?open=' + d.id);
}
function closePlayer() { dlg.classList.remove('on'); P.d = null; history.replaceState(null, '', location.pathname); }
document.getElementById('tp-close').addEventListener('click', closePlayer);
dlg.addEventListener('click', e => { if (e.target === dlg) closePlayer(); });
document.getElementById('tp-play').addEventListener('click', e => {
  P.playing = !P.playing; e.target.textContent = P.playing ? 'Pause' : 'Play';
  if (P.playing && P.t >= P.d.loop - 1) P.t = 0;
});
const scrub = document.getElementById('tp-scrub');
function seekFrom(e) {
  const r = scrub.getBoundingClientRect();
  P.t = clamp((e.clientX - r.left) / r.width) * P.d.loop;
  P.playing = false; document.getElementById('tp-play').textContent = 'Play';
}
scrub.addEventListener('pointerdown', e => { scrub.setPointerCapture(e.pointerId); seekFrom(e); });
scrub.addEventListener('pointermove', e => { if (e.buttons) seekFrom(e); });
window.addEventListener('keydown', e => {
  if (!P.d) return;
  if (e.key === 'Escape') closePlayer();
  else if (e.key === ' ') { e.preventDefault(); document.getElementById('tp-play').click(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); P.playing = false; document.getElementById('tp-play').textContent = 'Play';
    P.t = clamp(P.t + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 250 : 1000 / 30), 0, P.d.loop);
  }
});
window.addEventListener('resize', () => { if (P.d) sizePlayer(); });

/* ============================================================
   One clock for the page.
   ============================================================ */
function tick(now) {
  cards.forEach(c => { if (c.visible && !P.d) tpFrame(c.st, c.d, (now - c.t0) % c.d.loop); });
  if (P.d) {
    if (P.playing) { P.t += now - (P.last || now); if (P.t >= P.d.loop) P.t = 0; }
    tpFrame(P.st, P.d, P.t);
    document.querySelector('#tp-scrub .tp-head').style.left = (P.t / P.d.loop * 100) + '%';
    document.getElementById('tp-time').textContent = (P.t / 1000).toFixed(2) + ' s of ' + (P.d.loop / 1000).toFixed(1) + ' s';
  }
  P.last = now;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
cards.forEach(c => fit(c.vp, c.st));
if (q.has('open')) { const d = DESIGNS.find(x => x.id === q.get('open')); if (d) openPlayer(d); }
})();
</script>
</body>
</html>
