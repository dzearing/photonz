<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photonz · dashboard</title>
<link rel="stylesheet" href="/shared/photonz-ds.css">
<style>
  /* Project dashboard. Live page: everything below renders from /api/state,
     which aggregates queue/ at the repo root. Local classes are db- prefixed. */
  #dashboard{max-width:1180px;margin:0 auto}
  #dashboard #db-body{margin-top:var(--gap-lg)}
  /* things that arrive get a soft entrance; reduced-motion turns it off below */
  @keyframes db-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  #dashboard .db-enter{animation:db-in var(--dur-3) var(--ease-decel) both}

  /* ---- cards ---- */
  #dashboard .db-card{border:1px solid var(--edge-lo);border-radius:var(--r4);
    background:var(--glass-thin);backdrop-filter:var(--lg-blur-sm);-webkit-backdrop-filter:var(--lg-blur-sm);
    box-shadow:inset 0 1px 0 var(--edge-hi);overflow:hidden}
  #dashboard .db-card-h{display:flex;align-items:center;gap:var(--gap-sm);
    padding:var(--pad-sm) var(--pad);border-bottom:1px solid var(--edge-lo);
    background:color-mix(in srgb,var(--panel-2) 55%, transparent)}
  #dashboard .db-card-h h3{font-size:13px;font-weight:640;margin:0;letter-spacing:-.01em}
  #dashboard .db-card-h .k{font-size:10.5px;color:var(--faint);margin-left:auto}
  #dashboard .db-card-b{padding:var(--pad)}
  #dashboard .db-card-b.tight{padding:var(--s2) var(--pad)}

  /* ---- loop hero ---- */
  #dashboard .db-hero{display:flex;align-items:center;gap:var(--gap);padding:var(--pad)}
  #dashboard .db-hero .db-state{display:flex;align-items:center;gap:var(--gap-sm);flex:none;
    padding:var(--s2) var(--s3);border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:640}
  #dashboard .db-state.run{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  #dashboard .db-state.idle{color:var(--dim);background:var(--panel-2)}
  #dashboard .db-state.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  #dashboard .db-state.off{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent)}
  #dashboard .db-hero .db-what{min-width:0;flex:1}
  #dashboard .db-hero .db-what b{display:block;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-hero .db-what span{font-size:11.5px;color:var(--dim)}
  #dashboard .db-hero .db-beat{flex:none;text-align:right;font-size:10.5px;color:var(--faint);line-height:1.5}
  #dashboard .db-pulse{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative}
  #dashboard .db-state.run .db-pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;
    border:1px solid currentColor;opacity:.5;animation:db-ping 1.6s ease-out infinite}
  @keyframes db-ping{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.4);opacity:0}}

  /* ---- summary grid ---- */
  #dashboard .db-sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap)}
  #dashboard .db-sumgrid .span2{grid-column:1/-1}
  @media (max-width:860px){#dashboard .db-sumgrid{grid-template-columns:1fr}}

  /* ---- decisions: a carousel, one question at a time. Cards fade and flip
     out on answer; the next slides in from the right. ---- */
  #dashboard .db-decstage{position:relative;perspective:1100px}
  #dashboard .db-decide{border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r3);
    background:color-mix(in srgb,var(--warn) 6%,transparent);padding:var(--pad-sm) var(--pad) var(--pad);
    transform-origin:50% 50%;
    transition:opacity var(--dur-3) var(--ease-standard), transform var(--dur-3) var(--ease-standard)}
  /* The stage is a carousel seen from the front: a card leaving to the LEFT
     turns to face left (negative rotateY) as it rounds the cylinder, a card
     arriving from the RIGHT starts turned to face right (positive rotateY) and
     normalizes flat as it centers. Tilt direction always matches travel. */
  #dashboard .db-decide.out-left{opacity:0;transform:translateX(-64px) rotateY(-16deg) scale(.985)}
  #dashboard .db-decide.out-right{opacity:0;transform:translateX(64px) rotateY(16deg) scale(.985)}
  #dashboard .db-decide.out-done{opacity:0;transform:translateX(-40px) rotateY(-22deg) scale(.96)}
  #dashboard .db-decide.in-right{opacity:0;transform:translateX(80px) rotateY(16deg)}
  #dashboard .db-decide.in-left{opacity:0;transform:translateX(-80px) rotateY(-16deg)}
  #dashboard .db-decnav{display:flex;gap:2px;align-items:center}
  #dashboard .db-brieftoggle{margin-top:var(--s3)}
  #dashboard .db-brieftoggle .ic{transition:transform var(--dur-2) var(--ease-standard)}
  #dashboard .db-brieftoggle.on .ic{transform:rotate(180deg)}
  #dashboard .db-brief{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-3) var(--ease-standard)}
  #dashboard .db-brief.on{grid-template-rows:1fr}
  #dashboard .db-brief>div{overflow:hidden;min-height:0}
  #dashboard .db-brief .db-md{border-top:1px solid var(--line-soft);padding-top:var(--s3);margin-top:var(--s2)}
  #dashboard .db-decide .db-q{font-size:13px;font-weight:640;letter-spacing:-.01em;display:flex;gap:var(--gap-sm);align-items:flex-start}
  #dashboard .db-decide .db-q .ic{color:var(--warn);flex:none;margin-top:1px}
  #dashboard .db-decide .db-ctx{font-size:11px;color:var(--dim);line-height:1.5;margin:var(--s2) 0 0 26px;white-space:pre-wrap}
  #dashboard .db-decide .db-task{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:26px;margin-top:var(--s3)}
  #dashboard .db-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap-sm);margin:var(--s3) 0 0 26px}
  #dashboard .db-opt{display:flex;flex-direction:column;gap:var(--s2);min-width:0;
    border:1px solid var(--line);border-radius:var(--r3);padding:var(--pad-sm);
    background:color-mix(in srgb,var(--panel) 65%, transparent)}
  #dashboard .db-opt.rec{border-color:color-mix(in srgb,var(--good) 45%,transparent);
    background:color-mix(in srgb,var(--good) 8%,transparent)}
  #dashboard .db-opt .db-opt-t{font-size:12px;font-weight:640;letter-spacing:-.01em}
  #dashboard .db-opt.rec .db-opt-t .rec-k{color:var(--good);font-weight:600}
  #dashboard .db-opt .db-opt-s{font-size:11px;color:var(--dim);line-height:1.5;margin:0}
  #dashboard .db-opt .db-pc{display:flex;flex-direction:column;gap:3px;margin:0}
  #dashboard .db-opt .db-pc span{position:relative;display:block;padding-left:30px;font-size:10.5px;line-height:1.45;color:var(--dim)}
  #dashboard .db-opt .db-pc span::before{position:absolute;left:0;top:1px;font-weight:700;font-size:9px;letter-spacing:.02em}
  #dashboard .db-opt .db-pc .pro::before{content:"Pro";color:var(--good)}
  #dashboard .db-opt .db-pc .con::before{content:"Con";color:var(--crit)}
  #dashboard .db-opt .db-pc .fix::before{content:"Fix";color:var(--accent)}
  #dashboard .db-opt .db-opt-act{display:flex;gap:var(--s2);align-items:center;margin-top:auto;padding-top:var(--s2)}
  #dashboard .db-opt .db-opt-act .input{flex:1;min-width:0}
  #dashboard .db-opt .db-opt-act .btn{flex:none}

  /* ---- task rows ---- */
  #dashboard .db-row{display:flex;align-items:center;gap:var(--gap-sm);padding:var(--s2) 0;border-bottom:1px solid var(--line-soft);min-width:0}
  #dashboard .db-row:last-child{border-bottom:0}
  #dashboard .db-title{min-width:0;flex:1;font-size:12px;font-weight:560;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-meta{flex:none;font-size:10px;color:var(--faint);font-family:var(--mono)}
  #dashboard .db-sub{display:block;font-size:10.5px;font-weight:400;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-empty{font-size:11.5px;color:var(--faint);padding:var(--s3) 0;text-align:center}
  #dashboard .db-statusdot{flex:none}

  /* ---- tasks tab ---- */
  #dashboard .db-addform{display:grid;grid-template-columns:1fr 150px auto;gap:var(--gap-sm);align-items:center}
  #dashboard .db-addform .notes{grid-column:1/-1}
  @media (max-width:700px){#dashboard .db-addform{grid-template-columns:1fr}}
  /* details view: one shared column template so header and rows always align */
  #dashboard .db-tt{--tt-cols:64px 92px minmax(0,1fr) 104px 72px 122px 32px}
  #dashboard .db-ttbar{display:flex;align-items:center;gap:var(--gap-sm)}
  #dashboard .db-ttbar .input.search{width:220px}
  #dashboard .db-tthead,#dashboard .db-ttrow{display:grid;grid-template-columns:var(--tt-cols);gap:var(--gap-sm);align-items:center;min-width:0}
  #dashboard .db-tthead{padding:var(--s2) var(--pad);border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--panel-2) 55%, transparent)}
  #dashboard .db-tthead button{display:flex;align-items:center;gap:3px;border:0;background:transparent;padding:2px 0;
    font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);cursor:pointer;text-align:left}
  #dashboard .db-tthead button:hover{color:var(--dim)}
  #dashboard .db-tthead button.on{color:var(--accent)}
  #dashboard .db-tthead button .ic{width:10px;height:10px}
  #dashboard .db-ttrow{padding:var(--s2) var(--pad);border-bottom:1px solid var(--line-soft)}
  #dashboard .db-ttrow:last-child{border-bottom:0}
  #dashboard .db-ttrow:hover{background:var(--state-hover)}
  #dashboard .db-ttrow .seq{width:56px}
  #dashboard .db-ttrow .seq>input{text-align:left}
  #dashboard .db-ttrow .db-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap}
  #dashboard .db-ttempty{padding:var(--gap-lg) var(--pad);text-align:center;font-size:11.5px;color:var(--faint)}

  /* ---- data tab ---- */
  #dashboard .db-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
  #dashboard .db-tile{border:1px solid var(--edge-lo);border-radius:var(--r3);padding:var(--pad-sm) var(--pad);
    background:var(--glass-thin);box-shadow:inset 0 1px 0 var(--edge-hi)}
  #dashboard .db-tile .n{font-size:26px;font-weight:660;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
  #dashboard .db-tile .l{font-size:10.5px;color:var(--dim);margin-top:2px}
  #dashboard .db-tile .d{font-size:10px;color:var(--faint);margin-top:2px}
  #dashboard .db-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:var(--gap)}
  #dashboard .db-chart svg{display:block;width:100%;height:auto}
  #dashboard .db-legend{display:flex;gap:var(--gap);align-items:center;font-size:10.5px;color:var(--dim);margin-bottom:var(--s2)}
  #dashboard .db-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
  #dashboard .db-hbar{display:grid;grid-template-columns:86px 1fr 32px;align-items:center;gap:var(--gap-sm);padding:var(--s2) 0}
  #dashboard .db-hbar .l{font-size:11px;color:var(--dim);font-weight:560}
  #dashboard .db-hbar .t{height:14px;border-radius:4px;background:var(--panel-2);position:relative;overflow:hidden}
  #dashboard .db-hbar .t i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);min-width:2px}
  #dashboard .db-hbar .n{font-size:11px;font-weight:640;font-variant-numeric:tabular-nums;text-align:right}
  #dashboard .db-stack{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;background:transparent;margin:var(--s2) 0 var(--s3)}
  #dashboard .db-stack i{border-radius:3px;min-width:3px}
  #dashboard .db-stackleg{display:flex;flex-wrap:wrap;gap:var(--s2) var(--gap);font-size:11px;color:var(--dim)}
  #dashboard .db-stackleg b{color:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
  #dashboard .db-tip{position:fixed;z-index:50;pointer-events:none;background:var(--chrome-solid);border:1px solid var(--line);
    border-radius:var(--r2);padding:5px 9px;font-size:10.5px;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
  #dashboard .db-tip b{font-variant-numeric:tabular-nums}

  /* ---- objectives tab ---- */
  #dashboard .db-ob{list-style:none;margin:0;padding:0}
  #dashboard .db-ob .db-ob{padding-left:28px}
  #dashboard .db-obrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2);
    border:1px solid transparent;border-radius:var(--r2);min-width:0}
  #dashboard .db-obrow:hover{background:var(--state-hover)}
  #dashboard .db-obrow .grip{flex:none;color:var(--faint);cursor:grab;display:grid;place-items:center;width:18px}
  #dashboard .db-obrow .grip:active{cursor:grabbing}
  #dashboard .db-obrow .ttl{min-width:0;flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  #dashboard .db-ob .db-ob .db-obrow .ttl{font-weight:520;font-size:12px}
  #dashboard .db-obrow .sub{display:block;font-size:10.5px;font-weight:400;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-obrow .obact{flex:none;display:flex;gap:2px;opacity:0;transition:opacity .12s ease}
  #dashboard .db-obrow:hover .obact{opacity:1}
  #dashboard .db-obrow .ttl[contenteditable="true"]{outline:none;border-radius:4px;box-shadow:var(--ring);padding:0 4px;margin:0 -4px}
  #dashboard li[data-obid].dragging{opacity:.35}
  #dashboard .db-obrow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
  #dashboard .db-obrow.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
  #dashboard .db-obrow.drop-into{border-color:var(--accent);background:var(--accent-soft)}
  #dashboard .db-obhint{font-size:10.5px;color:var(--faint);margin:var(--s3) 0 0;line-height:1.5}

  /* ---- digest tab ---- */
  #dashboard .db-digrid{display:grid;grid-template-columns:170px 1fr;gap:var(--gap)}
  @media (max-width:700px){#dashboard .db-digrid{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){
    #dashboard .db-decide{transition:none}
    #dashboard .db-enter{animation:none}
    #dashboard .db-brief{transition:none}
  }
  #dashboard .db-dilist{display:flex;flex-direction:column;gap:2px}
  #dashboard .db-dilist button{text-align:left;border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:560;
    padding:7px 10px;border-radius:var(--r2);cursor:pointer;font-variant-numeric:tabular-nums}
  #dashboard .db-dilist button:hover{background:var(--panel-2);color:var(--ink)}
  #dashboard .db-dilist button.on{background:var(--accent-soft);color:var(--accent)}
  #dashboard .db-md{font-size:12.5px;line-height:1.65;color:var(--dim)}
  #dashboard .db-md h1{font-size:16px;letter-spacing:-.01em;color:var(--ink);margin:0 0 var(--s3)}
  #dashboard .db-md h2{font-size:13.5px;letter-spacing:-.01em;color:var(--ink);margin:var(--gap-lg) 0 var(--s2);
    padding-bottom:var(--s2);border-bottom:1px solid var(--line-soft)}
  #dashboard .db-md h3{font-size:12.5px;color:var(--ink);margin:var(--gap) 0 var(--s1)}
  #dashboard .db-md p{margin:0 0 var(--s3)}
  #dashboard .db-md ul,#dashboard .db-md ol{margin:0 0 var(--s3);padding-left:var(--gap-lg)}
  #dashboard .db-md li{margin-bottom:var(--s1)}
  #dashboard .db-md code{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:5px}
  #dashboard .db-md b,#dashboard .db-md strong{color:var(--ink);font-weight:620}
</style>
</head>
<body class="page">
<main class="stage">
  <section class="screen on" id="dashboard">
    <div class="scen-head"><span class="pip" style="background:var(--accent)"></span><h2>Project dashboard</h2><span class="k" id="db-refresh"></span></div>
    <p class="pglead">Photonz is being built by an unmanned loop that executes one task at a time. This page is its front door: what is running, what needs your call, what shipped, and how the numbers move. Resolving a question here feeds straight back into the queue.</p>

    <div id="db-body"><div class="db-empty">Connecting to the queue…</div></div>
    <div class="db-tip" id="db-tip"></div>
  </section>
</main>
<script src="/shared/photonz-ds.js"></script>
<script>
(function () {
  'use strict';
  var S = null, lastJSON = '', tab = 'summary', digestSel = null, digestCache = {};
  var body = document.getElementById('db-body');
  var tip = document.getElementById('db-tip');
  var PRIOS = ['p0-critical', 'p1-high', 'p2-normal', 'p3-low'];
  var PRIO_LABEL = { 'p0-critical': 'P0 critical', 'p1-high': 'P1 high', 'p2-normal': 'P2 normal', 'p3-low': 'P3 low' };
  var PRIO_BADGE = { 'p0-critical': 'badge crit', 'p1-high': 'badge warn', 'p2-normal': 'badge accent', 'p3-low': 'badge' };
  var STATUS_DOT = { pending: 'dot', in_progress: 'dot accent', blocked: 'dot warn', done: 'dot good', dropped: 'dot' };
  var STATUS_LABEL = { pending: 'pending', in_progress: 'in progress', blocked: 'blocked', done: 'done', dropped: 'dropped' };
  // Chart series pair, validated for CVD + contrast on both light and dark surfaces.
  var C_CREATED = '#4c6fff', C_COMPLETED = '#b7791f';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rel(iso) {
    if (!iso) return 'never';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 50) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function dayLabel(d) { return new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function lastNote(t) { var l = t.log || []; return l.length ? l[l.length - 1].note : ''; }

  // ---- data ----
  function load() {
    fetch('/api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
      S = data;
      var j = JSON.stringify(data);
      var typing = document.activeElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable);
      var editingObjectives = tab === 'objectives' && (obDirty || obDragId);
      var briefOpen = !!document.querySelector('.db-brief.on');
      if (j !== lastJSON && !typing && !editingObjectives && !decAnim && !briefOpen) { lastJSON = j; render(); }
      var r = document.getElementById('db-refresh');
      if (r) r.textContent = 'live · updated ' + rel(data.generated);
    }).catch(function () {
      body.innerHTML = '<div class="db-empty">The queue API is not answering. Is the dev server running from docs/design/mocks?</div>';
    });
  }
  function post(url, payload) {
    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) { lastJSON = ''; load(); return res; });
  }

  // ---- render root ----
  // Rows carry data-key; anything whose key was not present in the previous
  // render animates in, so arriving content lands gracefully instead of popping.
  var renderKeys = null;
  function render() {
    if (!S) return;
    if (tab === 'summary') body.innerHTML = renderSummary();
    if (tab === 'objectives') { body.innerHTML = renderObjectives(); wireObjectives(); }
    if (tab === 'tasks') body.innerHTML = renderTasks();
    if (tab === 'data') { body.innerHTML = renderData(); wireCharts(); }
    if (tab === 'digest') { body.innerHTML = renderDigest(); }
    var seen = {};
    body.querySelectorAll('[data-key]').forEach(function (el) {
      seen[el.dataset.key] = 1;
      if (renderKeys && !renderKeys[el.dataset.key]) el.classList.add('db-enter');
    });
    renderKeys = seen;
  }

  // ---- objectives: the commanding hub. An ordered epic tree; order is
  // priority, nesting is sub-epics. Drag to reorder or nest, edit inline,
  // then Retriage to make the loop re-align the whole queue. ----
  var obDirty = false;
  function obClone() { return JSON.parse(JSON.stringify((S.objectives && S.objectives.epics) || [])); }
  var obTree = null; // local working copy; survives polling re-renders while dirty
  function renderObjectives() {
    if (!obTree || !obDirty) obTree = obClone();
    var h = '<div class="db-card"><div class="db-card-h"><i class="ic ic-star"></i><h3>Objectives</h3><span class="k">order is priority, drag to reorder or nest</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn sm secondary" data-act="ob-add-root"><i class="ic ic-plus"></i>New epic</button>';
    h += '<button class="btn sm ' + (obDirty ? 'primary' : 'secondary') + '" data-act="ob-save"' + (obDirty ? '' : ' disabled') + '>Save order</button>';
    h += '<button class="btn sm primary" data-act="retriage" title="Queues an immediate triage pass so the loop re-aligns every task with these objectives">Retriage tasks</button>';
    h += '</div><div class="db-card-b">';
    h += obList(obTree);
    h += '<p class="db-obhint">Changes stay local until you press Save order. Retriage queues an immediate pass where the loop reprioritizes and resequences every open task to match this list. Drop a row onto the middle of another to nest it as a sub-epic.</p>';

  // line: open tasks over time (single series, accent, crosshair tooltip)

    if (days.length < 2) { el.innerHTML = '<div class="db-empty">Charts fill in once the loop has a day or two of history.</div>'; return; }
    var W = 560, H = 190, P = { l: 30, r: 10, t: 12, b: 24 };
    var max = Math.max.apply(null, days.map(function (d) { return d.open; }).concat([4]));
    var x = function (i) { return P.l + (W - P.l - P.r) * i / (days.length - 1); };
    var y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };

    [0, .5, 1].forEach(function (f) {
      var v = Math.round(max * f);

    s += '<path d="' + area + '" fill="var(--accent)" opacity="0.10"/>';
    s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<circle cx="' + x(days.length - 1) + '" cy="' + y(days[days.length - 1].open) + '" r="3.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>';
    s += '<line id="db-cross" y1="' + P.t + '" y2="' + (H - P.b) + '" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>';
    s += '<circle id="db-crossdot" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>';
    s += '</svg>';
    el.innerHTML = s;
    var svg = el.querySelector('svg');
    svg.addEventListener('mousemove', function (e) {
      var r = svg.getBoundingClientRect();
      var i = Math.round((e.clientX - r.left) / r.width * (days.length - 1) * (W / (W - P.l - P.r)) - P.l / (W - P.l - P.r) * (days.length - 1));
      i = Math.max(0, Math.min(days.length - 1, i));
      var cx = x(i), cy = y(days[i].open);
      svg.querySelector('#db-cross').setAttribute('x1', cx);
      svg.querySelector('#db-cross').setAttribute('x2', cx);
      svg.querySelector('#db-cross').setAttribute('visibility', 'visible');
      var dot = svg.querySelector('#db-crossdot');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
      showTip(e, dayLabel(days[i].day) + ' · <b>' + days[i].open + '</b> open');
    });
    svg.addEventListener('mouseleave', function () {
      svg.querySelector('#db-cross').setAttribute('visibility', 'hidden');
      svg.querySelector('#db-crossdot').setAttribute('visibility', 'hidden');
      hideTip();
    });
  }

  // paired bars: created vs completed (two validated series colors + legend + per-bar tooltip)
  function drawBars(el, days) {
    if (!el) return;
    if (!days.length) { el.innerHTML = '<div class="db-empty">No history yet.</div>'; return; }
    var W = 560, H = 190, P = { l: 30, r: 10, t: 12, b: 24 };
    var max = Math.max.apply(null, days.map(function (d) { return Math.max(d.created, d.completed); }).concat([4]));
    var slot = (W - P.l - P.r) / days.length, bw = Math.min(14, (slot - 8) / 2);
    var y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
    var h = '<div class="db-legend"><span><i style="background:' + C_CREATED + '"></i>Created</span><span><i style="background:' + C_COMPLETED + '"></i>Completed</span></div>';
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
    [0, .5, 1].forEach(function (f) {
      var v = Math.round(max * f);
      s += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)" stroke-width="1"/>';
      s += '<text x="' + (P.l - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="9" fill="var(--faint)">' + v + '</text>';
    });
    days.forEach(function (d, i) {
      var cx = P.l + slot * i + slot / 2;
      if (i === 0 || i === days.length - 1 || i % Math.ceil(days.length / 6) === 0) s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="var(--faint)">' + dayLabel(d.day) + '</text>';
      [['created', C_CREATED, cx - bw - 1], ['completed', C_COMPLETED, cx + 1]].forEach(function (spec) {
        var v = d[spec[0]], by = y(v), bh = Math.max(0, y(0) - by);
        if (v > 0 && bh < 3) { bh = 3; by = y(0) - 3; }
        s += '<rect data-day="' + d.day + '" data-kind="' + spec[0] + '" data-v="' + v + '" x="' + spec[2] + '" y="' + (v ? by : y(0) - 1) + '" width="' + bw + '" height="' + (v ? bh : 1) + '" rx="2.5" fill="' + spec[1] + '"' + (v ? '' : ' opacity="0.25"') + '/>';
      });
    });
    s += '</svg>';
    el.innerHTML = h + s;
    el.querySelectorAll('rect').forEach(function (r2) {
      r2.addEventListener('mousemove', function (e) { showTip(e, dayLabel(r2.dataset.day) + ' · ' + r2.dataset.kind + ' <b>' + r2.dataset.v + '</b>'); });
      r2.addEventListener('mouseleave', hideTip);
    });
  }

  // horizontal bars, one per priority; identity is the row label so all bars share the accent
  function drawPrio(el) {
    if (!el) return;
    var by = S.counts.byPriority;
    var max = Math.max.apply(null, PRIOS.map(function (p) { return by[p] || 0; }).concat([1]));
    el.innerHTML = PRIOS.map(function (p) {
      var v = by[p] || 0;
      return '<div class="db-hbar"><span class="l">' + PRIO_LABEL[p] + '</span><span class="t">' + (v ? '<i style="width:' + (v / max * 100) + '%"></i>' : '') + '</span><span class="n">' + v + '</span></div>';
    }).join('') + '<div class="docnote" style="margin-top:8px">Open tasks only. Done and dropped are excluded.</div>';
  }

  // stacked status bar; semantic colors, never color alone: the legend carries label + count
  function drawStack(el) {
    if (!el) return;
    var c = S.counts.byStatus;
    var parts = [
      { k: 'done', l: 'Done', col: 'var(--good)' },
      { k: 'in_progress', l: 'In progress', col: 'var(--accent)' },
      { k: 'pending', l: 'Pending', col: 'var(--faint)' },
      { k: 'blocked', l: 'Blocked', col: 'var(--warn)' },
      { k: 'dropped', l: 'Dropped', col: 'var(--line-strong)' }
    ].filter(function (p) { return c[p.k] > 0; });
    var total = parts.reduce(function (a, p) { return a + c[p.k]; }, 0);
    if (!total) { el.innerHTML = '<div class="db-empty">No tasks yet.</div>'; return; }
    el.innerHTML = '<div class="db-stack">' + parts.map(function (p) {
      return '<i style="flex:' + c[p.k] + ';background:' + p.col + '" title="' + p.l + ' ' + c[p.k] + '"></i>';
    }).join('') + '</div><div class="db-stackleg">' + parts.map(function (p) {
      return '<span><i class="dot" style="background:' + p.col + ';margin-right:5px"></i>' + p.l + ' <b>' + c[p.k] + '</b></span>';
    }).join('') + '</div>';
  }

  function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 10) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }

  // ---- digest ----
  function renderDigest() {
    var list = S.digests.list;
    if (!list.length) return '<div class="db-card"><div class="db-card-b"><div class="db-empty">No digest yet. The go loop writes one on its first pass each day: a summary of the last 24 hours, reflections, and a triage review.</div></div></div>';
    if (!digestSel || list.indexOf(digestSel) < 0) digestSel = list[0];
    var h = '<div class="db-digrid"><div class="db-dilist">';
    list.forEach(function (n) {
      h += '<button data-act="digest" data-name="' + esc(n) + '" class="' + (n === digestSel ? 'on' : '') + '">' + esc(n.replace('.md', '')) + '</button>';
    });
    h += '</div><div class="db-card"><div class="db-card-b"><div class="db-md" id="db-md">Loading…</div></div></div></div>';
    setTimeout(function () { loadDigest(digestSel); }, 0);
    return h;
  }
  function loadDigest(name) {
    var el = document.getElementById('db-md');
    if (!el) return;
    if (S.digests.latest && S.digests.latest.name === name) { el.innerHTML = md(S.digests.latest.body); return; }
    if (digestCache[name]) { el.innerHTML = md(digestCache[name]); return; }
    fetch('/api/digest/' + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (d) {
      digestCache[name] = d.body || '';
      el.innerHTML = md(digestCache[name]);
    });
  }
  // minimal markdown: headings, lists, bold, code, links. Digests are our own format.
  function md(src) {
    var out = [], para = [], inList = false;
    function flushPara() { if (para.length) { out.push('<p>' + para.join(' ') + '</p>'); para = []; } }
    function inline(s) {
      return esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    String(src || '').split('\n').forEach(function (line) {
      var m;
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushPara(); if (inList) { out.push('</ul>'); inList = false; } out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); return; }
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) { flushPara(); if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if (!line.trim()) { flushPara(); if (inList) { out.push('</ul>'); inList = false; } return; }
      para.push(inline(line));
    });
    flushPara(); if (inList) out.push('</ul>');
    return out.join('\n');
  }

  // ---- actions ----
  document.getElementById('dashboard').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act], [data-dbtab], [data-tsort], [data-tfilter]');
    if (!b) return;
    if (b.dataset.dbtab) { setTab(b.dataset.dbtab, true); return; }
    if (b.dataset.tsort) {
      if (tSort.key === b.dataset.tsort) tSort.dir = -tSort.dir;
      else tSort = { key: b.dataset.tsort, dir: 1 };
      render();
      return;
    }
    if (b.dataset.tfilter) { tFilter = b.dataset.tfilter; render(); return; }
    if (b.dataset.act === 'ob-add-root' || b.dataset.act === 'ob-add-child') {
      var epic = { id: 'epic-' + Math.random().toString(36).slice(2, 8), title: 'New epic', note: '', children: [] };
      if (b.dataset.act === 'ob-add-root') obTree.push(epic);
      else { var pf = obFind(obTree, b.dataset.id); if (!pf) return; pf.node.children = pf.node.children || []; pf.node.children.push(epic); }
      obDirty = true; render();
      obStartRename(epic.id);
      return;
    }
    if (b.dataset.act === 'ob-rename') { obStartRename(b.dataset.id); return; }
    if (b.dataset.act === 'ob-delete') {
      var df = obFind(obTree, b.dataset.id);
      if (df) { df.list.splice(df.index, 1); obMarkDirty(); }
      return;
    }
    if (b.dataset.act === 'ob-save') { obSave(); return; }
    if (b.dataset.act === 'retriage') {
      b.textContent = 'Queuing…'; b.disabled = true;
      var ready = obDirty ? post('/api/objectives', { epics: obTree }).then(function () { obDirty = false; }) : Promise.resolve();
      ready.then(function () { return post('/api/retriage', {}); }).then(function () { b.textContent = 'Retriage queued'; });
      return;
    }
    if (b.dataset.act === 'decide') {
      if (decAnim) return;
      var noteEl = document.querySelector('[data-notefor="' + b.dataset.id + '/' + b.dataset.choice + '"]');
      b.textContent = 'Sending…'; b.disabled = true;
      decResolve(b.dataset.id, b.dataset.choice, noteEl ? noteEl.value : '');
      return;
    }
    if (b.dataset.act === 'dec-prev') { decStep(-1); return; }
    if (b.dataset.act === 'dec-next') { decStep(1); return; }
    if (b.dataset.act === 'dec-brief') {
      var wrap = document.querySelector('[data-brieffor="' + b.dataset.id + '"]');
      if (!wrap) return;
      var opening = !wrap.classList.contains('on');
      wrap.classList.toggle('on', opening);
      b.classList.toggle('on', opening);
      var md0 = wrap.querySelector('.db-md');
      if (opening && !md0.innerHTML) {
        md0.innerHTML = '<p>Loading…</p>';
        fetch('/api/decision-brief/' + encodeURIComponent(b.dataset.id)).then(function (r) { return r.json(); })
          .then(function (r) { md0.innerHTML = md(r.body || 'No brief was written for this decision.'); })
          .catch(function () { md0.innerHTML = '<p>The brief could not be loaded.</p>'; });
      }
      return;
    }
    if (b.dataset.act === 'add') {
      var t = document.getElementById('db-new-title'), p = document.getElementById('db-new-prio'), n = document.getElementById('db-new-notes');
      if (!t.value.trim()) { t.focus(); return; }
      post('/api/task', { title: t.value.trim(), priority: p.value, notes: n.value.trim() });
      t.value = ''; n.value = '';
    }
    if (b.dataset.act === 'drop') {
      post('/api/task/update', { id: b.dataset.id, status: 'dropped', note: 'dropped from the dashboard' });
    }
    if (b.dataset.act === 'digest') { digestSel = b.dataset.name; render(); }
  });
  document.getElementById('dashboard').addEventListener('change', function (e) {
    var s = e.target.closest('select[data-act="prio"]');
    if (s) { post('/api/task/update', { id: s.dataset.id, priority: s.value }); return; }
    var q2 = e.target.closest('input[data-act="seq"]');
    if (q2) {
      var v = parseFloat(q2.value);
      if (isFinite(v)) post('/api/task/update', { id: q2.dataset.id, seq: v });
      else { lastJSON = ''; load(); }
    }
  });
  // the search box filters the table body in place, so typing never loses focus
  document.getElementById('dashboard').addEventListener('input', function (e) {
    if (e.target.id === 'db-tquery') { tQuery = e.target.value; refreshRows(); }
  });

  function setTab(t, push) {
    tab = t;
    render();
    if (push) {
      try { history.replaceState(null, '', '?tab=' + t); } catch (err) {}
      try { parent.postMessage({ photonzDashTab: t }, '*'); } catch (err) {}
    }
  }

  var q = new URLSearchParams(location.search).get('tab');
  if (q && ['summary', 'objectives', 'tasks', 'data', 'digest'].indexOf(q) >= 0) setTab(q, false);
  load();
  setInterval(function () { if (!document.hidden) load(); }, 4000);
})();
</script>
