<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photonz · dashboard</title>
<link rel="stylesheet" href="/shared/photonz-ds.css">
<style>
  /* Project dashboard. Live page: everything below renders from /api/state,
     which aggregates queue/ at the repo root. Local classes are db- prefixed. */
  #dashboard{max-width:1180px;margin:0 auto}
  #dashboard #db-body{margin-top:var(--gap-lg)}
  /* the page-level control slot sits at the far end of the title row, opposite
     the title, so it reads as "this page's control" rather than part of the name */
  #dashboard #db-headslot{margin-left:auto;display:flex;align-items:center;gap:var(--gap-sm)}
  #dashboard #db-headslot:empty{display:none}
  /* things that arrive get a soft entrance; reduced-motion turns it off below */
  @keyframes db-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  #dashboard .db-enter{animation:db-in var(--dur-3) var(--ease-decel) both}
  /* a section change uses the shared view entrance (view.css), not a local one */

  /* ---- cards ---- */
  #dashboard .db-card{border:1px solid var(--edge-lo);border-radius:var(--r4);
    background:var(--glass-thin);backdrop-filter:var(--lg-blur-sm);-webkit-backdrop-filter:var(--lg-blur-sm);
    box-shadow:inset 0 1px 0 var(--edge-hi);overflow:hidden}
  #dashboard .db-card-h{display:flex;align-items:center;gap:var(--gap-sm);
    padding:var(--pad-sm) var(--pad);border-bottom:1px solid var(--edge-lo);
    background:color-mix(in srgb,var(--panel-2) 55%, transparent)}
  #dashboard .db-card-h h3{font-size:13px;font-weight:640;margin:0;letter-spacing:-.01em}
  #dashboard .db-card-h .k{font-size:10.5px;color:var(--faint);margin-left:auto}
  #dashboard .db-card-b{padding:var(--pad)}
  #dashboard .db-card-b.tight{padding:var(--s2) var(--pad)}

  /* ---- loop hero ---- */
  #dashboard .db-hero{display:flex;align-items:center;gap:var(--gap);padding:var(--pad)}
  #dashboard .db-hero .db-state{display:flex;align-items:center;gap:var(--gap-sm);flex:none;
    padding:var(--s2) var(--s3);border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:640}
  #dashboard .db-state.run{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  #dashboard .db-state.idle{color:var(--dim);background:var(--panel-2)}
  #dashboard .db-state.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  #dashboard .db-state.off{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent)}
  #dashboard .db-state.bad{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 12%,transparent)}
  /* The failure strip: when runners keep dying the hero has to say so, in the
     runner's own words, instead of quietly reading Running. */
  #dashboard .db-herr{display:flex;gap:var(--gap-sm);align-items:flex-start;
    padding:var(--pad-sm) var(--pad);border-top:1px solid color-mix(in srgb,var(--crit) 25%,transparent);
    background:color-mix(in srgb,var(--crit) 7%,transparent)}
  #dashboard .db-herr .ic{color:var(--crit);flex:none;margin-top:1px}
  #dashboard .db-herr b{display:block;font-size:12px;letter-spacing:-.01em}
  /* the runner's own words stay mono; our explanation of them does not */
  #dashboard .db-herr code{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);
    margin-top:var(--s2);white-space:pre-wrap;word-break:break-word;line-height:1.5}
  #dashboard .db-herr p{margin:var(--s2) 0 0;font-size:11.5px;color:var(--dim);line-height:1.5}
  #dashboard .db-hero .db-what{min-width:0;flex:1}
  #dashboard .db-hero .db-what b{display:block;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-hero .db-what span{font-size:11.5px;color:var(--dim)}
  #dashboard .db-hero .db-beat{flex:none;text-align:right;font-size:10.5px;color:var(--faint);line-height:1.5}
  #dashboard .db-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;position:relative}
  #dashboard .db-state.run .db-pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;
    border:1px solid currentColor;opacity:.5;animation:db-ping 1.6s ease-out infinite}
  @keyframes db-ping{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.4);opacity:0}}

  /* ---- summary grid ---- */
  #dashboard .db-sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap)}
  #dashboard .db-sumgrid .span2{grid-column:1/-1}
  @media (max-width:860px){#dashboard .db-sumgrid{grid-template-columns:1fr}}

  /* ---- decisions: a carousel, one question at a time. Cards fade and flip
     out on answer; the next slides in from the right. ---- */
  #dashboard .db-decstage{position:relative;perspective:1100px}
  #dashboard .db-decide{border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r3);
    background:color-mix(in srgb,var(--warn) 6%,transparent);padding:var(--pad-sm) var(--pad) var(--pad);
    transform-origin:50% 50%;
    transition:opacity var(--dur-3) var(--ease-standard), transform var(--dur-3) var(--ease-standard)}
  /* The stage is a carousel seen from the front: a card leaving to the LEFT
     turns to face left (negative rotateY) as it rounds the cylinder, a card
     arriving from the RIGHT starts turned to face right (positive rotateY) and
     normalizes flat as it centers. Tilt direction always matches travel. */
  #dashboard .db-decide.out-left{opacity:0;transform:translateX(-64px) rotateY(-16deg) scale(.985)}
  #dashboard .db-decide.out-right{opacity:0;transform:translateX(64px) rotateY(16deg) scale(.985)}
  #dashboard .db-decide.out-done{opacity:0;transform:translateX(-40px) rotateY(-22deg) scale(.96)}
  #dashboard .db-decide.in-right{opacity:0;transform:translateX(80px) rotateY(16deg)}
  #dashboard .db-decide.in-left{opacity:0;transform:translateX(-80px) rotateY(-16deg)}
  #dashboard .db-decnav{display:flex;gap:2px;align-items:center}
  #dashboard .db-brieftoggle{margin-top:var(--s3)}
  #dashboard .db-brieftoggle .ic{transition:transform var(--dur-2) var(--ease-standard)}
  #dashboard .db-brieftoggle.on .ic{transform:rotate(180deg)}
  #dashboard .db-brief{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-3) var(--ease-standard)}
  #dashboard .db-brief.on{grid-template-rows:1fr}
  #dashboard .db-brief>div{overflow:hidden;min-height:0}
  #dashboard .db-brief .db-md{border-top:1px solid var(--line-soft);padding-top:var(--s3);margin-top:var(--s2)}
  #dashboard .db-decide .db-q{font-size:13px;font-weight:640;letter-spacing:-.01em;display:flex;gap:var(--gap-sm);align-items:flex-start}
  #dashboard .db-decide .db-q .ic{color:var(--warn);flex:none;margin-top:1px}
  #dashboard .db-decide .db-ctx{font-size:11px;color:var(--dim);line-height:1.5;margin:var(--s2) 0 0 var(--s5);white-space:pre-wrap}
  #dashboard .db-decide .db-task{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-left:var(--s5);margin-top:var(--s3)}
  #dashboard .db-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap-sm);margin:var(--s3) 0 0 var(--s5)}
  #dashboard .db-opt{display:flex;flex-direction:column;gap:var(--s2);min-width:0;
    border:1px solid var(--line);border-radius:var(--r3);padding:var(--pad-sm);
    background:color-mix(in srgb,var(--panel) 65%, transparent)}
  #dashboard .db-opt.db-rec{border-color:color-mix(in srgb,var(--good) 45%,transparent);
    background:color-mix(in srgb,var(--good) 8%,transparent)}
  #dashboard .db-opt .db-opt-t{font-size:12px;font-weight:640;letter-spacing:-.01em}
  #dashboard .db-opt.db-rec .db-opt-t .db-rec-k{color:var(--good);font-weight:600}
  #dashboard .db-opt .db-pc .stop::before{content:"Stop";color:var(--warn)}
  #dashboard .db-opt .db-pc .stop{color:var(--txt)}
  #dashboard .db-opt .db-opt-s{font-size:11px;color:var(--dim);line-height:1.5;margin:0}
  #dashboard .db-opt .db-pc{display:flex;flex-direction:column;gap:3px;margin:0}
  #dashboard .db-opt .db-pc span{position:relative;display:block;padding-left:var(--s6);font-size:10.5px;line-height:1.45;color:var(--dim)}
  #dashboard .db-opt .db-pc span::before{position:absolute;left:0;top:1px;font-weight:700;font-size:9px;letter-spacing:.02em}
  #dashboard .db-opt .db-pc .pro::before{content:"Pro";color:var(--good)}
  #dashboard .db-opt .db-pc .con::before{content:"Con";color:var(--crit)}
  #dashboard .db-opt .db-pc .fix::before{content:"Fix";color:var(--accent)}
  #dashboard .db-opt .db-opt-act{display:flex;gap:var(--s2);align-items:center;margin-top:auto;padding-top:var(--s2)}
  #dashboard .db-opt .db-opt-act .input{flex:1;min-width:0}
  #dashboard .db-opt .db-opt-act .btn{flex:none}

  /* ---- task rows ---- */
  #dashboard .db-row{display:flex;align-items:center;gap:var(--gap-sm);padding:var(--s2) 0;border-bottom:1px solid var(--line-soft);min-width:0}
  #dashboard .db-row:last-child{border-bottom:0}
  #dashboard .db-title{min-width:0;flex:1;font-size:12px;font-weight:560;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-meta{flex:none;font-size:10px;color:var(--faint);font-family:var(--mono)}
  #dashboard .db-sub{display:block;font-size:10.5px;font-weight:400;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-empty{font-size:11.5px;color:var(--faint);padding:var(--s3) 0;text-align:center}
  #dashboard .db-statusdot{flex:none}

  /* ---- tasks tab ---- */
  #dashboard .db-addform{display:grid;grid-template-columns:1fr 150px auto;gap:var(--gap-sm);align-items:center}
  #dashboard .db-addform .notes{grid-column:1/-1}
  @media (max-width:700px){#dashboard .db-addform{grid-template-columns:1fr}}
  /* details view: one shared column template so header and rows always align */
  /* The title is the thing you actually read, so everything else is squeezed to
     a glyph or a two-character chip and the title takes the rest. Editing
     controls live in the detail dialog, not in the row. */
  #dashboard .db-tt{--tt-cols:20px 40px 28px minmax(0,1fr) 66px}
  /* how many rows the current filter is showing, next to the card's title */
  #dashboard .db-count{flex:none;min-width:20px;text-align:center;font-size:9.5px;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);
    border:1px solid var(--accent-line);border-radius:999px;padding:1px 6px;line-height:1.5}
  #dashboard .db-ttbar{display:flex;align-items:center;gap:var(--gap-sm)}
  #dashboard .db-ttbar .input.search{width:220px}
  #dashboard .db-tthead,#dashboard .db-ttrow{display:grid;grid-template-columns:var(--tt-cols);gap:var(--gap-sm);align-items:center;min-width:0}
  #dashboard .db-tthead{padding:var(--s2) var(--pad);border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--panel-2) 55%, transparent)}
  #dashboard .db-tthead button{display:flex;align-items:center;gap:3px;border:0;background:transparent;padding:2px 0;
    font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);cursor:pointer}
  #dashboard .db-tthead button:hover{color:var(--dim)}
  #dashboard .db-tthead button.on{color:var(--accent)}
  /* Column alignment is declared ONCE per column and applied to the header and
     the row cells together, so a header can never drift off its own data:
     status centered on its glyph, seq right (numbers compare on their last
     digit), pri centered on its chip, task left, updated right. */
  #dashboard .db-tthead>*:nth-child(1),#dashboard .db-ttrow>*:nth-child(1){justify-self:center}
  #dashboard .db-tthead>*:nth-child(2),#dashboard .db-ttrow>*:nth-child(2){justify-self:end;text-align:right}
  #dashboard .db-tthead>*:nth-child(3),#dashboard .db-ttrow>*:nth-child(3){justify-self:center}
  #dashboard .db-tthead>*:nth-child(4),#dashboard .db-ttrow>*:nth-child(4){justify-self:stretch;text-align:left}
  #dashboard .db-tthead>*:nth-child(5),#dashboard .db-ttrow>*:nth-child(5){justify-self:end;text-align:right}
  #dashboard .db-ttrow{padding:var(--s2) var(--pad);border-bottom:1px solid var(--line-soft)}
  #dashboard .db-ttrow:last-child{border-bottom:0}
  #dashboard .db-ttrow:hover{background:var(--state-hover)}
  #dashboard .db-ttrow .db-sicon{display:grid;place-items:center;width:20px}
  #dashboard .db-ttrow .db-sicon>.ic{width:14px;height:14px}
  #dashboard .db-sicon.s-pending>.ic{color:var(--faint)}
  #dashboard .db-sicon.s-in_progress>.ic{color:var(--accent)}
  #dashboard .db-sicon.s-blocked>.ic,#dashboard .db-sicon.s-parked>.ic{color:var(--warn)}
  #dashboard .db-sicon.s-done>.ic{color:var(--good)}
  #dashboard .db-sicon.s-dropped>.ic{color:var(--line-strong)}
  #dashboard .db-ttrow .db-seq{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right}
  /* the priority chip is two characters wide on purpose: P1 is the whole message */
  #dashboard .db-pri{display:inline-grid;place-items:center;width:26px;height:16px;border-radius:5px;
    font-size:9.5px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  #dashboard .db-pri.p0{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
  #dashboard .db-pri.p1{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  #dashboard .db-pri.p2{color:var(--accent);background:var(--accent-soft)}
  #dashboard .db-pri.p3{color:var(--faint);background:var(--panel-2)}
  #dashboard .db-ttempty{padding:var(--gap-lg) var(--pad);text-align:center;font-size:11.5px;color:var(--faint)}

  /* ---- data tab ---- */
  #dashboard .db-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
  #dashboard .db-tile{border:1px solid var(--edge-lo);border-radius:var(--r3);padding:var(--pad-sm) var(--pad);
    background:var(--glass-thin);box-shadow:inset 0 1px 0 var(--edge-hi)}
  #dashboard .db-tile .n{font-size:26px;font-weight:660;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
  #dashboard .db-tile .l{font-size:10.5px;color:var(--dim);margin-top:2px}
  #dashboard .db-tile .d{font-size:10px;color:var(--faint);margin-top:2px}
  #dashboard .db-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:var(--gap)}
  #dashboard .db-chart svg{display:block;width:100%;height:auto}
  #dashboard .db-legend{display:flex;gap:var(--gap);align-items:center;font-size:10.5px;color:var(--dim);margin-bottom:var(--s2)}
  #dashboard .db-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:var(--s1);vertical-align:-1px}
  /* a line series gets a line swatch, not a square: the legend mark matches the mark */
  #dashboard .db-legend i.line{width:14px;height:2px;border-radius:1px;vertical-align:3px}
  #dashboard .db-hbar{display:grid;grid-template-columns:88px 1fr 32px;align-items:center;gap:var(--gap-sm);padding:var(--s2) 0}
  #dashboard .db-hbar .l{font-size:11px;color:var(--dim);font-weight:560}
  #dashboard .db-hbar .t{height:14px;border-radius:4px;background:var(--panel-2);position:relative;overflow:hidden}
  #dashboard .db-hbar .t i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);min-width:2px}
  #dashboard .db-hbar .n{font-size:11px;font-weight:640;font-variant-numeric:tabular-nums;text-align:right}
  #dashboard .db-stack{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;background:transparent;margin:var(--s2) 0 var(--s3)}
  #dashboard .db-stack i{border-radius:3px;min-width:3px}
  #dashboard .db-stackleg{display:flex;flex-wrap:wrap;gap:var(--s2) var(--gap);font-size:11px;color:var(--dim)}
  #dashboard .db-stackleg b{color:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
  /* chart readouts use the DS tooltip's readout variant (D12); this page owns
     no tooltip of its own */

  /* ---- task detail overlay: the DS dialog, scoped to a full page ----
     .dlg-scrim is absolute because it normally lives inside a .win mock; this
     page IS the window, so it goes fixed. Everything else is the DS component. */
  #dashboard .dlg-scrim{position:fixed}
  #dashboard .db-detail{width:min(760px,calc(100% - var(--s7)));max-height:84vh;
    transform:scale(.97) translateY(6px);opacity:0;
    transition:transform var(--dur-3) var(--ease-decel), opacity var(--dur-2) var(--ease-standard)}
  #dashboard .dlg-scrim.on .db-detail{transform:none;opacity:1}
  #dashboard .db-detail .dlg-h{align-items:flex-start}
  #dashboard .db-detail .dlg-h b{line-height:1.35}
  #dashboard .db-detail .dlg-h .db-hmeta{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}
  #dashboard .db-detail .dlg-h .db-x{margin-left:auto;flex:none}
  #dashboard .db-detail .dlg-b{overflow:auto;display:flex;flex-direction:column;gap:var(--gap-lg)}
  #dashboard .db-dsec>.mlabel{margin-bottom:var(--s2)}
  #dashboard .db-dsec p{margin:0;font-size:12px;line-height:1.6;color:var(--dim);white-space:pre-wrap}
  /* the goal is the sentence a person reads first, so it is ink, not dim */
  #dashboard .db-goal{color:var(--ink);font-size:12.5px;line-height:1.6;max-width:62em}
  #dashboard .db-nogoal{color:var(--faint);font-style:italic}
  /* working detail is for the runner: quieter, monospace-adjacent, behind a toggle */
  #dashboard .db-tnotes{font-size:11.5px;line-height:1.6;color:var(--dim);padding-top:var(--s2)}
  #dashboard .db-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
  #dashboard .db-fact .k{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
  #dashboard .db-fact .v{display:block;font-size:12px;color:var(--ink);font-weight:560;margin-top:2px}
  #dashboard .db-fact .v.mono{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--dim);word-break:break-all}
  #dashboard .db-acc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
  #dashboard .db-acc li{position:relative;padding-left:22px;font-size:12px;line-height:1.5;color:var(--dim)}
  #dashboard .db-acc li::before{content:"";position:absolute;left:4px;top:6px;width:6px;height:6px;border-radius:2px;
    border:1px solid var(--line-strong)}
  #dashboard .db-acc li.met::before{background:var(--good);border-color:var(--good)}
  #dashboard .db-deps{display:flex;flex-wrap:wrap;gap:var(--s2)}
  /* Activity is a LIST, so it gets rows: one column template, a separator per
     row, and a time column wide enough for the timestamp it actually renders.
     At 92px the time overflowed its cell and collided with the note ("11:34
     PMcreated"), which is what happens when a column is sized by guess. */
  #dashboard .db-log{display:flex;flex-direction:column;max-height:280px;overflow:auto;
    padding-right:var(--s2)}
  #dashboard .db-logrow{display:grid;grid-template-columns:124px minmax(0,1fr);gap:var(--s3);
    align-items:baseline;padding:var(--s2) 0;border-bottom:1px solid var(--line-soft)}
  #dashboard .db-logrow:last-child{border-bottom:0}
  #dashboard .db-logrow .t{font-family:var(--mono);font-size:9.5px;color:var(--faint);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  #dashboard .db-logrow .n{font-size:11.5px;line-height:1.5;color:var(--dim);white-space:pre-wrap;min-width:0}
  #dashboard .db-ttrow{cursor:pointer}
  #dashboard .db-ttrow .input,#dashboard .db-ttrow .select,#dashboard .db-ttrow .btn{cursor:auto}

  /* ---- objectives tab ---- */
  #dashboard .db-focus{border-color:var(--accent-line);background:color-mix(in srgb,var(--accent) 7%,transparent)}
  #dashboard .db-focus-t{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin-top:var(--s1)}
  #dashboard .db-focus-n{margin:var(--s2) 0 0;font-size:11.5px;line-height:1.55;color:var(--dim);max-width:70em}
  #dashboard .db-princ{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
  #dashboard .db-princ li{position:relative;padding-left:18px;font-size:11.5px;line-height:1.55;color:var(--dim)}
  #dashboard .db-princ li::before{content:"";position:absolute;left:4px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  /* stage says when an epic is allowed to hold work, so it reads at a glance */
  #dashboard .db-stage{display:inline-block;margin-left:var(--s2);font-size:8.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:1px 6px;border-radius:999px;vertical-align:1px}
  #dashboard .db-stage.s-now{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
  #dashboard .db-stage.s-next{color:var(--accent);background:var(--accent-soft)}
  #dashboard .db-stage.s-later{color:var(--faint);background:var(--panel-2)}
  #dashboard .db-ob{list-style:none;margin:0;padding:0}
  #dashboard .db-ob .db-ob{padding-left:28px}
  #dashboard .db-obrow{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s2);
    border:1px solid transparent;border-radius:var(--r2);min-width:0}
  #dashboard .db-obrow:hover{background:var(--state-hover)}
  #dashboard .db-obrow .db-grip{flex:none;color:var(--faint);cursor:grab;display:grid;place-items:center;width:20px}
  #dashboard .db-obrow .db-grip:active{cursor:grabbing}
  #dashboard .db-obrow .db-obttl{min-width:0;flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  #dashboard .db-ob .db-ob .db-obrow .db-obttl{font-weight:520;font-size:12px}
  #dashboard .db-obrow .db-obsub{display:block;font-size:10.5px;font-weight:400;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dashboard .db-obrow .obact{flex:none;display:flex;gap:2px;opacity:0;transition:opacity .12s ease}
  #dashboard .db-obrow:hover .obact{opacity:1}
  #dashboard .db-obrow .db-obttl[contenteditable="true"]{outline:none;border-radius:4px;box-shadow:var(--ring);padding:0 4px;margin:0 -4px}
  #dashboard li[data-obid].dragging{opacity:.35}
  #dashboard .db-obrow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
  #dashboard .db-obrow.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
  #dashboard .db-obrow.drop-into{border-color:var(--accent);background:var(--accent-soft)}
  #dashboard .db-obhint{font-size:10.5px;color:var(--faint);margin:var(--s3) 0 0;line-height:1.5}

  @media (prefers-reduced-motion:reduce){
    #dashboard .db-decide{transition:none}
    #dashboard .db-enter{animation:none}
    #dashboard .db-brief{transition:none}
  }

  /* ---- audits: short, scannable, and every line answers back ---- */
  #dashboard .db-afeature{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
  #dashboard .db-asum{margin:0;font-size:12.5px;line-height:1.6;color:var(--dim);max-width:70em}
  #dashboard .db-asetup{margin:var(--s3) 0 0;font-size:11px;color:var(--faint);line-height:1.5}
  #dashboard .db-asetup b{color:var(--dim);font-weight:600}
  /* a commentable line: content, and a control that stays quiet until you want it */
  #dashboard .db-aline{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 24px;
    gap:var(--s2);align-items:start;padding:var(--s2) 0;border-bottom:1px solid var(--line-soft)}
  #dashboard .db-aline:last-child,#dashboard .db-aline.lead{border-bottom:0}
  #dashboard .db-aline.lead{padding-top:var(--s2)}
  #dashboard .db-acomment{opacity:0;transition:opacity var(--dur-1) var(--ease-standard)}
  #dashboard .db-aline:hover .db-acomment,#dashboard .db-aline.commenting .db-acomment{opacity:1}
  /* a line stacks: the sentence, then anything illustrating it. This was a
     wrapping flex row with baseline alignment, and a tall screenshot in a
     baseline-aligned row hangs ABOVE its own text, which is how the shot ended
     up beside step one instead of under it. */
  #dashboard .db-abody{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
  #dashboard .db-arow{display:flex;gap:var(--gap-sm);align-items:baseline;min-width:0}
  #dashboard .db-anum{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
    font-size:9.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);font-variant-numeric:tabular-nums}
  #dashboard .db-ado{font-size:12.5px;line-height:1.55;color:var(--ink);flex:1;min-width:0}
  #dashboard .db-aq{font-size:12.5px;line-height:1.55;color:var(--dim)}
  #dashboard .db-aother{color:var(--faint);font-style:italic}
  /* a screenshot belongs UNDER its step, not beside it: as a flex item it took
     its own width and sat next to the sentence it illustrates */
  #dashboard .db-abody img{flex:0 0 100%;width:100%;max-width:460px;margin-top:var(--s2);
    border:1px solid var(--line);border-radius:var(--r3)}
  #dashboard .db-acomposer{grid-column:1/-1;margin-top:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
  #dashboard .db-acta{display:flex;gap:var(--s2);justify-content:flex-end}
  #dashboard .db-afiled{grid-column:1/-1;display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--good);margin-top:2px}
  #dashboard .db-afiled .ic{width:12px;height:12px}

  /* ---- digest tab ---- */
  /* The day list used to be a rail down the left. Picking a date is a one-shot
     choice, not something you scan, so it moved into a select beside the page
     title and the digest got the reclaimed width. Prose still gets a measure:
     a 1200px line of body text is unreadable no matter how much room there is. */
  #dashboard .db-md{font-size:12.5px;line-height:1.65;color:var(--dim);max-width:860px}
  /* a feature report carries screenshots; they sit on the same measure as the prose */
  #dashboard .db-md img{max-width:100%;height:auto;display:block;margin:var(--s3) 0;
    border:1px solid var(--line);border-radius:var(--r3)}
  #dashboard .db-md h1{font-size:16px;letter-spacing:-.01em;color:var(--ink);margin:0 0 var(--s3)}
  #dashboard .db-md h2{font-size:13.5px;letter-spacing:-.01em;color:var(--ink);margin:var(--gap-lg) 0 var(--s2);
    padding-bottom:var(--s2);border-bottom:1px solid var(--line-soft)}
  #dashboard .db-md h3{font-size:12.5px;color:var(--ink);margin:var(--gap) 0 var(--s1)}
  #dashboard .db-md p{margin:0 0 var(--s3)}
  #dashboard .db-md ul,#dashboard .db-md ol{margin:0 0 var(--s3);padding-left:var(--gap-lg)}
  #dashboard .db-md li{margin-bottom:var(--s1)}
  #dashboard .db-md code{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:5px}
  #dashboard .db-md b,#dashboard .db-md strong{color:var(--ink);font-weight:620}
</style>
</head>
<body class="page">
<main class="stage">
  <section class="screen on" id="dashboard">
    <div class="scen-head"><span class="pip" style="background:var(--accent)"></span><h2 id="db-title">Summary</h2><span class="k" id="db-refresh"></span><span id="db-headslot"></span></div>

    <div id="db-body"><div class="db-empty">Connecting to the queue…</div></div>
  </section>
</main>
<script src="/shared/photonz-ds.js"></script>
<script>
(function () {
  'use strict';
  var S = null, lastJSON = '', tab = 'summary', digestSel = null, digestCache = {}, detailId = null;
  var body = document.getElementById('db-body');
  var PRIOS = ['p0-critical', 'p1-high', 'p2-normal', 'p3-low'];
  var PRIO_LABEL = { 'p0-critical': 'P0 critical', 'p1-high': 'P1 high', 'p2-normal': 'P2 normal', 'p3-low': 'P3 low' };
  var PRIO_BADGE = { 'p0-critical': 'badge crit', 'p1-high': 'badge warn', 'p2-normal': 'badge accent', 'p3-low': 'badge' };
  var STATUS_DOT = { pending: 'dot', in_progress: 'dot accent', blocked: 'dot warn', done: 'dot good', dropped: 'dot' };
  var STATUS_LABEL = { pending: 'pending', in_progress: 'in progress', blocked: 'blocked', done: 'done', dropped: 'dropped' };
  var STATUS_ICON = { pending: 'ic-circle', in_progress: 'ic-play', blocked: 'ic-warning', done: 'ic-check-circle', dropped: 'ic-x-circle', parked: 'ic-pause' };
  // Chart series pair, validated for CVD + contrast on both light and dark surfaces.
  var C_OPENED = '#b7791f', C_DONE = '#4c6fff';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rel(iso) {
    if (!iso) return 'never';
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 50) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function dayLabel(d) { return new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function lastNote(t) { var l = t.log || []; return l.length ? l[l.length - 1].note : ''; }

  // ---- data ----
  function load() {
    fetch('/api/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
      S = data;
      // `generated` is stamped fresh on every response, so comparing the raw
      // payload made every poll look like a change and re-rendered the whole
      // page (charts, markdown and all) every 4 seconds. Compare the CONTENT.
      var j = JSON.stringify(data, function (k, v) { return k === 'generated' ? undefined : v; });
      var typing = document.activeElement && (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable);
      var editingObjectives = tab === 'objectives' && (obDirty || obDragId);
      var briefOpen = !!document.querySelector('.db-brief.on');
      // a re-render would rebuild the open dialog under the pointer and reset
      // its scroll, so live updates wait until it closes
      if (j !== lastJSON && !typing && !editingObjectives && !decAnim && !briefOpen && !detailId) {
        lastJSON = j;
        // on the tasks tab the page is already right; only the rows changed, so
        // update them in place and let the choreography show what moved
        if (tab === 'tasks' && document.getElementById('db-tt-body')) refreshTasksTable();
        else render();
      }
      var r = document.getElementById('db-refresh');
      if (r) r.textContent = 'live · updated ' + rel(data.generated);
    }).catch(function () {
      body.innerHTML = '<div class="db-empty">The queue API is not answering. Is the dev server running from docs/design/mocks?</div>';
    });
  }
  function post(url, payload) {
    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) { lastJSON = ''; load(); return res; });
  }

  // ---- render root ----
  // Rows carry data-key; anything whose key was not present in the previous
  // render animates in, so arriving content lands gracefully instead of popping.
  var renderKeys = null, shownTab = null;
  var TAB_TITLE = { summary: 'Summary', objectives: 'Objectives', tasks: 'Tasks', audits: 'Ready to try', data: 'Data', digest: 'Digest' };
  // Play the entrance only when the SECTION changed. A poll-driven re-render of
  // the section you are already looking at must not re-animate it, or the page
  // would twitch every 4 seconds.
  function playViewEnter() {
    if (shownTab === tab) return;
    shownTab = tab;
    PZ.view.enter(body);
  }
  function render() {
    // The page names itself after the section you are in, and it knows that
    // from the URL, not from the data. This ran BELOW the `!S` guard, so the
    // static "Summary" in the markup stayed on screen for the whole first
    // fetch: clicking Objectives showed the wrong title until the payload
    // landed. The heading is free, so it is painted first, every time.
    var titleEl = document.getElementById('db-title');
    if (titleEl) titleEl.textContent = TAB_TITLE[tab] || 'Summary';
    if (!S) return;
    var slot = document.getElementById('db-headslot');
    if (slot) slot.innerHTML = tab === 'digest' ? digestPicker() : tab === 'audits' ? auditPicker() : '';
    if (tab === 'summary') body.innerHTML = renderSummary();
    if (tab === 'objectives') { body.innerHTML = renderObjectives(); wireObjectives(); }
    if (tab === 'tasks') body.innerHTML = renderTasks();
    if (tab === 'data') { body.innerHTML = renderData(); wireCharts(); }
    if (tab === 'audits') { body.innerHTML = renderAudits(); }
    if (tab === 'digest') { body.innerHTML = renderDigest(); }
    playViewEnter();
    var seen = {};
    body.querySelectorAll('[data-key]').forEach(function (el) {
      seen[el.dataset.key] = 1;
      if (renderKeys && !renderKeys[el.dataset.key]) el.classList.add('db-enter');
    });
    renderKeys = seen;
    // the detail overlay is rendered closed; hand it to the DS component, which
    // animates it in and calls back when any of the dismiss gestures closes it
    var scrim = document.getElementById('db-detail-dlg');
    if (scrim && detailId && !scrim.classList.contains('on')) {
      PZ.dialog.open(scrim, { onClose: function () { detailId = null; render(); } });
    }
  }
  // close through the component so the exit animation runs, THEN do the work
  function closeDetail(after) {
    var scrim = document.getElementById('db-detail-dlg');
    if (!scrim || !detailId) { if (after) after(); return; }
    detailId = null;                       // stop the poll guard blocking updates
    PZ.dialog.close(scrim, function () { if (after) after(); else render(); });
  }

  // ---- objectives: the commanding hub. An ordered epic tree; order is
  // priority, nesting is sub-epics. Drag to reorder or nest, edit inline,
  // then Retriage to make the loop re-align the whole queue. ----
  var obDirty = false;
  function obClone() { return JSON.parse(JSON.stringify((S.objectives && S.objectives.epics) || [])); }
  var obTree = null; // local working copy; survives polling re-renders while dirty
  function renderObjectives() {
    if (!obTree || !obDirty) obTree = obClone();
    var meta = S.objectives || {};
    var h = '';
    // The focus is the whole point of this page: one feature at a time, and
    // everything else visibly waiting its turn.
    if (meta.focus) {
      var f = (obTree || []).find(function (e) { return e.id === meta.focus; });
      h += '<div class="db-card db-focus"><div class="db-card-b">' +
        '<div class="mlabel">In focus now</div>' +
        '<div class="db-focus-t">' + esc(f ? f.title : meta.focus) + '</div>' +
        (f && f.note ? '<p class="db-focus-n">' + esc(f.note) + '</p>' : '') +
        '</div></div>';
    }
    if ((meta.principles || []).length) {
      h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-h"><i class="ic ic-info"></i><h3>How we choose work</h3></div>' +
        '<div class="db-card-b"><ul class="db-princ">' +
        meta.principles.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') +
        '</ul></div></div>';
    }
    h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-h"><i class="ic ic-star"></i><h3>Objectives</h3><span class="k">order is priority, drag to reorder or nest</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn sm secondary" data-act="ob-add-root"><i class="ic ic-plus"></i>New epic</button>';
    h += '<button class="btn sm ' + (obDirty ? 'primary' : 'secondary') + '" data-act="ob-save"' + (obDirty ? '' : ' disabled') + '>Save order</button>';
    h += '<button class="btn sm primary" data-act="retriage" title="Queues an immediate triage pass so the loop re-aligns every task with these objectives">Retriage tasks</button>';
    h += '</div><div class="db-card-b">';
    h += obList(obTree);
    h += '<p class="db-obhint">Changes stay local until you press Save order. Retriage queues an immediate pass where the loop reprioritizes and resequences every open task to match this list. Drop a row onto the middle of another to nest it as a sub-epic.</p>';
    h += '</div></div>';
    return h;
  }
  function obList(list, depth) {
    depth = depth || 0;
    var h = '<ul class="db-ob">';
    list.forEach(function (e) {
      h += '<li data-obid="' + esc(e.id) + '" draggable="true">';
      h += '<div class="db-obrow">';
      h += '<span class="db-grip" title="Drag to reorder or nest"><i class="ic ic-more-vertical"></i></span>';
      h += '<span class="db-obttl" data-obtitle="' + esc(e.id) + '">' + esc(e.title) +
        // stage is a decision about a whole epic, so a sub-epic never wears one
        (depth === 0 && e.stage ? ' <span class="db-stage s-' + esc(e.stage) + '">' + esc(e.stage) + '</span>' : '') +
        (e.note ? '<span class="db-obsub">' + esc(e.note) + '</span>' : '') + '</span>';
      h += '<span class="obact">';
      h += '<button class="btn icon sm ghost" data-act="ob-add-child" data-id="' + esc(e.id) + '" title="Add a sub-epic"><i class="ic ic-plus"></i></button>';
      h += '<button class="btn icon sm ghost" data-act="ob-rename" data-id="' + esc(e.id) + '" title="Rename"><i class="ic ic-pencil"></i></button>';
      h += '<button class="btn icon sm ghost" data-act="ob-delete" data-id="' + esc(e.id) + '" title="Delete"><i class="ic ic-trash"></i></button>';
      h += '</span></div>';
      if (e.children && e.children.length) h += obList(e.children, depth + 1);
      h += '</li>';
    });
    h += '</ul>';
    return h;
  }
  function obFind(list, id, parent) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return { list: list, index: i, node: list[i], parent: parent || null };
      var r = obFind(list[i].children || [], id, list[i]);
      if (r) return r;
    }
    return null;
  }
  function obMarkDirty() { obDirty = true; render(); }
  function obSave() {
    post('/api/objectives', { epics: obTree }).then(function () { obDirty = false; });
  }
  var obDragId = null;
  function wireObjectives() {
    body.querySelectorAll('li[data-obid]').forEach(function (li) {
      li.addEventListener('dragstart', function (e) {
        e.stopPropagation();
        obDragId = li.dataset.obid;
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', obDragId); } catch (err) {}
      });
      li.addEventListener('dragend', function () { li.classList.remove('dragging'); clearDrops(); obDragId = null; });
      var row = li.querySelector(':scope > .db-obrow');
      row.addEventListener('dragover', function (e) {
        if (!obDragId || obDragId === li.dataset.obid) return;
        e.preventDefault(); e.stopPropagation();
        var r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
        row.classList.remove('drop-before', 'drop-after', 'drop-into');
        row.classList.add(y < .35 ? 'drop-before' : y > .65 ? 'drop-after' : 'drop-into');
      });
      row.addEventListener('dragleave', function () { row.classList.remove('drop-before', 'drop-after', 'drop-into'); });
      row.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        var mode = row.classList.contains('drop-before') ? 'before' : row.classList.contains('drop-after') ? 'after' : 'into';
        clearDrops();
        var targetId = li.dataset.obid;
        if (!obDragId || obDragId === targetId) return;
        var src = obFind(obTree, obDragId);
        if (!src) return;
        // refuse to drop a node into its own subtree
        if (obFind([src.node], targetId)) return;
        src.list.splice(src.index, 1);
        var dst = obFind(obTree, targetId);
        if (!dst) { src.list.push(src.node); return; }
        if (mode === 'into') { dst.node.children = dst.node.children || []; dst.node.children.push(src.node); }
        else dst.list.splice(dst.index + (mode === 'after' ? 1 : 0), 0, src.node);
        obMarkDirty();
      });
    });
    function clearDrops() { body.querySelectorAll('.db-obrow').forEach(function (r) { r.classList.remove('drop-before', 'drop-after', 'drop-into'); }); }
  }
  function obStartRename(id) {
    var el = body.querySelector('[data-obtitle="' + id + '"]');
    var found = obFind(obTree, id);
    if (!el || !found) return;
    el.textContent = found.node.title;
    el.setAttribute('contenteditable', 'true');
    el.focus();
    document.getSelection().selectAllChildren(el);
    function finish(commit) {
      el.removeAttribute('contenteditable');
      if (commit) {
        var v = el.textContent.trim();
        if (v && v !== found.node.title) { found.node.title = v; obMarkDirty(); return; }
      }
      render(); wireObjectives();
    }
    el.addEventListener('blur', function () { finish(true); }, { once: true });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
  }

  // ---- decision carousel ----
  var decIdx = 0, decAnim = false;
  function decPending() { return (S && S.decisions.pending) || []; }
  function decCount(pend) {
    if (!pend.length) return 'nothing waiting';
    return (decIdx + 1) + ' of ' + pend.length + ' waiting, tasks are blocked on these';
  }
  function decEmpty() { return '<div class="db-empty">No open questions. The loop will surface UX and product calls here instead of guessing.</div>'; }
  function decCard(d) {
    var h = '<div class="db-decide" data-decision="' + esc(d.id) + '">';
    h += '<div class="db-q"><i class="ic ic-help"></i><span>' + esc(d.question) + '</span></div>';
    if (d.context) h += '<div class="db-ctx">' + esc(d.context) + '</div>';
    h += '<div class="db-opts">';
    var opts = (d.options || []).slice().sort(function (a, b) { return (b.id === d.recommended) - (a.id === d.recommended); });
    opts.forEach(function (o) {
      var rec = o.id === d.recommended;
      // The answer that means do not build this retires the task instead of
      // sending it back to the loop. Say so on the card, so the choice is
      // honest before it is made and not only in the history afterwards.
      var stop = !!o.declines;
      var noteKey = d.id + '/' + o.id;
      h += '<div class="db-opt' + (rec ? ' db-rec' : '') + (stop ? ' db-stop' : '') + '">';
      h += '<div class="db-opt-t">' + esc(o.label) + (rec ? ' <span class="db-rec-k">(Recommended)</span>' : '') + '</div>';
      var summary = o.summary || o.detail;
      if (summary) h += '<p class="db-opt-s">' + esc(summary) + '</p>';
      var pc = '';
      (o.pros || []).forEach(function (p) { pc += '<span class="pro">' + esc(p) + '</span>'; });
      (o.cons || []).forEach(function (c) { pc += '<span class="con">' + esc(c) + '</span>'; });
      if (o.mitigation) pc += '<span class="fix">' + esc(o.mitigation) + '</span>';
      if (stop) pc += '<span class="stop">Retires this task. It will not be built, and no runner picks it up again.</span>';
      if (pc) h += '<div class="db-pc">' + pc + '</div>';
      h += '<div class="db-opt-act">';
      // the class names the WELL, so it goes on the wrapper and the real field
      // lives inside it — on the field itself you get the dark well and none of
      // the ink. See shared/check-fieldwrap.mjs.
      h += '<label class="input sm"><input name="note-' + esc(noteKey) + '" placeholder="Optional note" data-notefor="' + esc(noteKey) + '"></label>';

  function taskRowsData() {

    }

    h += '</div>';

    h += '<div class="db-charts">';
    h += '<div class="db-card db-chart"><div class="db-card-h"><h3>Total opened vs completed</h3><span class="k">running totals, the gap is open work</span></div><div class="db-card-b" id="db-line"></div></div>';
    h += '<div class="db-card db-chart"><div class="db-card-h"><h3>Opened vs completed by day</h3><span class="k">daily intake and outtake</span></div><div class="db-card-b" id="db-bars"></div></div>';
    h += '<div class="db-card db-chart"><div class="db-card-h"><h3>Open by priority</h3></div><div class="db-card-b" id="db-prio-chart"></div></div>';
    h += '<div class="db-card db-chart"><div class="db-card-h"><h3>Status mix</h3><span class="k">every task ever filed</span></div><div class="db-card-b" id="db-stack"></div></div>';
    h += '</div>';
    return h;
  }
  function tile(n, l, d) { return '<div class="db-tile"><div class="n">' + n + '</div><div class="l">' + l + '</div><div class="d">' + d + '</div></div>'; }

  function contDays(series, maxDays) {
    if (!series.length) return [];
    var by = {}; series.forEach(function (s) { by[s.day] = s; });
    var out = [], d = new Date(series[0].day + 'T12:00:00'), today = new Date();
    var lastOpen = 0;
    while (out.length < 400) {
      var key = d.toISOString().slice(0, 10);
      var row = by[key] || { day: key, created: 0, completed: 0, open: lastOpen };
      lastOpen = row.open;
      out.push(row);
      if (key >= today.toISOString().slice(0, 10)) break;
      d.setDate(d.getDate() + 1);
    }
    return out.slice(-maxDays);
  }

  // Running totals, accumulated over ALL history before the display window is
  // sliced, so a 14-day view still shows true totals rather than a window sum.
  function cumulative(days) {
    var o = 0, c = 0;
    return days.map(function (d) {
      o += d.created; c += d.completed;
      return { day: d.day, created: d.created, completed: d.completed, open: d.open, openedTotal: o, doneTotal: c };
    });
  }

  function wireCharts() {
    var all = cumulative(contDays(S.series, 400));
    drawLine(document.getElementById('db-line'), all.slice(-21));
    drawBars(document.getElementById('db-bars'), all.slice(-14));
    drawPrio(document.getElementById('db-prio-chart'));
    drawStack(document.getElementById('db-stack'));
  }

  // Two running totals on one axis: everything opened, everything completed.
  // Same measure, same scale, so the GAP between the lines is the open backlog,
  // and the two slopes read as intake rate against completion rate.
  function drawLine(el, days) {
    if (!el) return;
    if (days.length < 2) { el.innerHTML = '<div class="db-empty">Charts fill in once the loop has a day or two of history.</div>'; return; }
    var W = 560, H = 190, P = { l: 32, r: 10, t: 12, b: 24 };
    var max = Math.max.apply(null, days.map(function (d) { return d.openedTotal; }).concat([4]));
    var x = function (i) { return P.l + (W - P.l - P.r) * i / (days.length - 1); };
    var y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
    var path = function (key) {
      return days.map(function (d, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[key]).toFixed(1); }).join(' ');
    };
    var openedLine = path('openedTotal'), doneLine = path('doneTotal');
    var h = '<div class="db-legend"><span><i class="line" style="background:' + C_OPENED + '"></i>Total opened</span>' +
      '<span><i class="line" style="background:' + C_DONE + '"></i>Total completed</span></div>';
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" id="db-line-svg">';
    [0, .5, 1].forEach(function (f) {
      var v = Math.round(max * f);
      s += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)" stroke-width="1"/>';
      s += '<text x="' + (P.l - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="9" fill="var(--faint)">' + v + '</text>';
    });
    days.forEach(function (d, i) {
      if (i === 0 || i === days.length - 1 || i % Math.ceil(days.length / 6) === 0) s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="var(--faint)">' + dayLabel(d.day) + '</text>';
    });
    // the band between the lines is the open backlog, drawn faintly so the gap
    // reads as a quantity rather than as empty space: opened forward, completed back
    var fwd = days.map(function (d, i) { return x(i).toFixed(1) + ' ' + y(d.openedTotal).toFixed(1); });
    var back = days.map(function (d, i) { return x(i).toFixed(1) + ' ' + y(d.doneTotal).toFixed(1); }).reverse();
    s += '<path d="M' + fwd.join(' L') + ' L' + back.join(' L') + ' Z" fill="' + C_OPENED + '" opacity="0.07"/>';
    s += '<path d="' + doneLine + '" fill="none" stroke="' + C_DONE + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<path d="' + openedLine + '" fill="none" stroke="' + C_OPENED + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var last = days[days.length - 1];
    s += '<circle cx="' + x(days.length - 1) + '" cy="' + y(last.doneTotal) + '" r="3.5" fill="' + C_DONE + '" stroke="var(--panel)" stroke-width="2"/>';
    s += '<circle cx="' + x(days.length - 1) + '" cy="' + y(last.openedTotal) + '" r="3.5" fill="' + C_OPENED + '" stroke="var(--panel)" stroke-width="2"/>';
    s += '<line id="db-cross" y1="' + P.t + '" y2="' + (H - P.b) + '" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>';
    s += '<circle id="db-crossdot" r="4" fill="' + C_OPENED + '" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>';
    s += '<circle id="db-crossdot2" r="4" fill="' + C_DONE + '" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>';
    s += '</svg>';
    el.innerHTML = h + s;
    var svg = el.querySelector('svg');
    svg.addEventListener('mousemove', function (e) {
      var r = svg.getBoundingClientRect();
      var i = Math.round((e.clientX - r.left) / r.width * (days.length - 1) * (W / (W - P.l - P.r)) - P.l / (W - P.l - P.r) * (days.length - 1));
      i = Math.max(0, Math.min(days.length - 1, i));
      var cx = x(i), d = days[i];
      svg.querySelector('#db-cross').setAttribute('x1', cx);
      svg.querySelector('#db-cross').setAttribute('x2', cx);
      svg.querySelector('#db-cross').setAttribute('visibility', 'visible');
      var dot = svg.querySelector('#db-crossdot'), dot2 = svg.querySelector('#db-crossdot2');
      dot.setAttribute('cx', cx); dot.setAttribute('cy', y(d.openedTotal)); dot.setAttribute('visibility', 'visible');
      dot2.setAttribute('cx', cx); dot2.setAttribute('cy', y(d.doneTotal)); dot2.setAttribute('visibility', 'visible');
      // anchored to the crosshair, midway between the two series markers, so
      // the values and the point they describe read as one thing
      var mid = (y(d.openedTotal) + y(d.doneTotal)) / 2;
      showTip(svgPoint(svg, W, cx, mid),
        dayLabel(d.day) + ' · opened <b>' + d.openedTotal + '</b> · completed <b>' + d.doneTotal +
        '</b> · open <b>' + (d.openedTotal - d.doneTotal) + '</b>');
    });
    svg.addEventListener('mouseleave', function () {
      svg.querySelector('#db-cross').setAttribute('visibility', 'hidden');
      svg.querySelector('#db-crossdot').setAttribute('visibility', 'hidden');
      svg.querySelector('#db-crossdot2').setAttribute('visibility', 'hidden');
      hideTip();
    });
  }

  // Daily intake vs outtake: two bars per day, side by side. Per-day counts, not
  // totals, so a day where more came in than went out is visible at a glance.
  function drawBars(el, days) {
    if (!el) return;
    if (!days.length) { el.innerHTML = '<div class="db-empty">No history yet.</div>'; return; }
    var W = 560, H = 190, P = { l: 30, r: 10, t: 12, b: 24 };
    var max = Math.max.apply(null, days.map(function (d) { return Math.max(d.created, d.completed); }).concat([4]));
    var slot = (W - P.l - P.r) / days.length, bw = Math.min(14, (slot - 8) / 2);
    var y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
    var h = '<div class="db-legend"><span><i style="background:' + C_OPENED + '"></i>Opened</span>' +
      '<span><i style="background:' + C_DONE + '"></i>Completed</span></div>';
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
    [0, .5, 1].forEach(function (f) {
      var v = Math.round(max * f);
      s += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)" stroke-width="1"/>';
      s += '<text x="' + (P.l - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end" font-size="9" fill="var(--faint)">' + v + '</text>';
    });
    days.forEach(function (d, i) {
      var cx = P.l + slot * i + slot / 2;
      if (i === 0 || i === days.length - 1 || i % Math.ceil(days.length / 6) === 0) s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="var(--faint)">' + dayLabel(d.day) + '</text>';
      [['opened', 'created', C_OPENED, cx - bw - 1], ['completed', 'completed', C_DONE, cx + 1]].forEach(function (spec) {
        var v = d[spec[1]], by = y(v), bh = Math.max(0, y(0) - by);
        if (v > 0 && bh < 3) { bh = 3; by = y(0) - 3; }
        s += '<rect data-day="' + d.day + '" data-kind="' + spec[0] + '" data-v="' + v + '" x="' + spec[3] + '" y="' + (v ? by : y(0) - 1) + '" width="' + bw + '" height="' + (v ? bh : 1) + '" rx="2.5" fill="' + spec[2] + '"' + (v ? '' : ' opacity="0.25"') + '/>';
      });
    });
    s += '</svg>';
    el.innerHTML = h + s;
    el.querySelectorAll('rect').forEach(function (r2) {
      // a bar's value lives at its top edge, so that is what the readout hugs
      r2.addEventListener('mousemove', function () {
        var br = r2.getBoundingClientRect();
        showTip({ clientX: br.left + br.width / 2, clientY: br.top },
          dayLabel(r2.dataset.day) + ' · ' + r2.dataset.kind + ' <b>' + r2.dataset.v + '</b>');
      });
      r2.addEventListener('mouseleave', hideTip);
    });
  }

  // horizontal bars, one per priority; identity is the row label so all bars share the accent
  function drawPrio(el) {
    if (!el) return;
    var by = S.counts.byPriority;
    var max = Math.max.apply(null, PRIOS.map(function (p) { return by[p] || 0; }).concat([1]));
    el.innerHTML = PRIOS.map(function (p) {
      var v = by[p] || 0;
      return '<div class="db-hbar"><span class="l">' + PRIO_LABEL[p] + '</span><span class="t">' + (v ? '<i style="width:' + (v / max * 100) + '%"></i>' : '') + '</span><span class="n">' + v + '</span></div>';
    }).join('') + '<div class="docnote" style="margin-top:var(--s2)">Open tasks only. Done and dropped are excluded.</div>';
  }

  // stacked status bar; semantic colors, never color alone: the legend carries label + count
  function drawStack(el) {
    if (!el) return;
    var c = S.counts.byStatus;
    var parts = [
      { k: 'done', l: 'Done', col: 'var(--good)' },
      { k: 'in_progress', l: 'In progress', col: 'var(--accent)' },
      { k: 'pending', l: 'Pending', col: 'var(--faint)' },
      { k: 'blocked', l: 'Blocked', col: 'var(--warn)' },
      { k: 'dropped', l: 'Dropped', col: 'var(--line-strong)' }
    ].filter(function (p) { return c[p.k] > 0; });
    var total = parts.reduce(function (a, p) { return a + c[p.k]; }, 0);
    if (!total) { el.innerHTML = '<div class="db-empty">No tasks yet.</div>'; return; }
    el.innerHTML = '<div class="db-stack">' + parts.map(function (p) {
      return '<i style="flex:' + c[p.k] + ';background:' + p.col + '" title="' + p.l + ' ' + c[p.k] + '"></i>';
    }).join('') + '</div><div class="db-stackleg">' + parts.map(function (p) {
      return '<span><i class="dot" style="background:' + p.col + ';margin-right:var(--s1)"></i>' + p.l + ' <b>' + c[p.k] + '</b></span>';
    }).join('') + '</div>';
  }

  // Chart readouts anchor to the MARK, not the cursor (D13): callers pass the
  // crosshair's screen x (or a bar's top edge), so the numbers sit beside the
  // thing they describe. The DS handles flipping and clamping from there.
  function showTip(anchor, html) { PZ.tip.readout(html, anchor); }
  function hideTip() { PZ.tip.readout(null); }
  // an SVG user-space point in screen coordinates, for a chart drawn to a viewBox
  function svgPoint(svg, vbWidth, ux, uy) {
    var r = svg.getBoundingClientRect(), k = r.width / vbWidth;
    return { clientX: r.left + ux * k, clientY: r.top + uy * k };
  }

  // ---- audits: try a feature, react to any line of it ----
  // The report is structured rather than prose, so it stays short AND every
  // line is a thing the user can disagree with. A reaction files a task with
  // the line quoted, which is the whole handoff back to the loop.
  var auditSel = null, auditCache = {}, commentOn = null, filed = {};
  function auditTitle(name) {
    var m = name.replace('.json', '').match(/^(\d{4}-\d{2}-\d{2})-(.*)$/);
    if (!m) return name.replace('.json', '');
    return m[2].replace(/-/g, ' ') + ' · ' + dayLabel(m[1]);
  }
  function auditPicker() {
    var list = (S && S.audits) || [];
    if (list.length < 2) return '';
    if (!auditSel || list.indexOf(auditSel) < 0) auditSel = list[0];
    return '<select class="select sm" id="db-asel" title="Pick a feature report">' + list.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === auditSel ? ' selected' : '') + '>' + esc(auditTitle(n)) + '</option>';
    }).join('') + '</select>';
  }
  // one commentable line: the content, plus a quiet control that opens a composer
  function auditLine(cls, anchor, quote, inner) {
    var open = commentOn === anchor;
    var key = auditSel + '|' + anchor;
    var h = '<div class="db-aline ' + cls + (open ? ' commenting' : '') + '" data-anchor="' + esc(anchor) + '">';
    h += '<div class="db-abody">' + inner + '</div>';
    h += '<button class="btn icon sm ghost db-acomment" data-act="audit-comment" data-anchor="' + esc(anchor) +
      '" data-quote="' + esc(quote) + '" title="Comment on this"><i class="ic ic-chat"></i></button>';
    if (filed[key]) h += '<span class="db-afiled"><i class="ic ic-check"></i>filed</span>';
    if (open) {
      h += '<div class="db-acomposer">' +
        '<label class="input area block"><textarea id="db-ctext" rows="2" placeholder="What is wrong with this, or what would you rather?"></textarea></label>' +
        '<div class="db-acta"><button class="btn sm ghost" data-act="audit-cancel">Cancel</button>' +
        '<button class="btn sm primary" data-act="audit-send" data-anchor="' + esc(anchor) + '" data-quote="' + esc(quote) + '">File as task</button></div>' +
        '</div>';
    }
    h += '</div>';
    return h;
  }
  function renderAudits() {
    var list = (S.audits) || [];
    if (!list.length) {
      return '<div class="db-card"><div class="db-card-b"><div class="db-empty">' +
        'Nothing to try yet. When the loop finishes a feature it leaves a short report here: what it is, ' +
        'a handful of steps to try it, and what to judge. You can comment on any line and it becomes a task.' +
        '</div></div></div>';
    }
    if (!auditSel || list.indexOf(auditSel) < 0) auditSel = list[0];
    var a = auditCache[auditSel];
    if (!a) { setTimeout(function () { loadAudit(auditSel); }, 0); return '<div class="db-card"><div class="db-card-b"><div class="db-empty">Loading…</div></div></div>'; }

    var h = '<div class="db-card db-audit"><div class="db-card-b">';
    h += '<div class="db-afeature">' + esc(a.feature || auditTitle(auditSel)) + '</div>';
    if (a.summary) h += auditLine('lead', 'summary', a.summary, '<p class="db-asum">' + esc(a.summary) + '</p>');
    if (a.setup) h += '<p class="db-asetup"><b>Setup</b> ' + esc(a.setup) + '</p>';
    h += '</div></div>';

    if ((a.try || []).length) {
      h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-h"><i class="ic ic-play"></i><h3>Try it</h3><span class="k">' + a.try.length + ' steps</span></div><div class="db-card-b">';
      a.try.forEach(function (st, i) {
        var inner = '<div class="db-arow"><span class="db-anum">' + (i + 1) + '</span><span class="db-ado">' + esc(st.do || '') + '</span></div>';
        if (st.shot) inner += '<img src="/api/audit-shot/' + encodeURIComponent(st.shot) + '" alt="" loading="lazy">';
        h += auditLine('step', 'try-' + i, st.do || '', inner);
      });
      h += '</div></div>';
    }
    if ((a.evaluate || []).length) {
      h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-h"><i class="ic ic-help"></i><h3>What to judge</h3></div><div class="db-card-b">';
      a.evaluate.forEach(function (q, i) { h += auditLine('q', 'eval-' + i, q, '<span class="db-aq">' + esc(q) + '</span>'); });
      h += '</div></div>';
    }
    if ((a.rough || []).length) {
      h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-h"><i class="ic ic-warning" style="color:var(--warn)"></i><h3>Known rough edges</h3></div><div class="db-card-b">';
      a.rough.forEach(function (r, i) { h += auditLine('rough', 'rough-' + i, r, '<span class="db-aq">' + esc(r) + '</span>'); });
      h += '</div></div>';
    }
    // a catch-all, because not every reaction is about a specific line
    h += '<div class="db-card" style="margin-top:var(--gap)"><div class="db-card-b">' +
      auditLine('other', 'general', a.feature || '', '<span class="db-aq db-aother">Something else about this feature</span>') +
      '</div></div>';
    return h;
  }
  function loadAudit(name) {
    fetch('/api/audit/' + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (d) {
      auditCache[name] = d.body || d;
      if (auditSel === name) render();
    }).catch(function () {
      var el = document.getElementById('db-body');
      if (el) el.innerHTML = '<div class="db-card"><div class="db-card-b"><div class="db-empty">That report could not be loaded.</div></div></div>';
    });
  }

  // ---- digest ----
  // Every digest is addressable: ?tab=digest&d=2026-08-23.md is a real URL that
  // opens that day standalone, and the shell mirrors it as #dashboard@digest/<name>.
  function digestURL(name) { return '?tab=digest&d=' + encodeURIComponent(name); }
  // The day picker rides beside the page title, so the digest itself gets the
  // full width. It is a real <select> because picking one of N dates is exactly
  // what a select is for, and the dates stay addressable as their own URLs.
  function digestPicker() {
    var list = (S && S.digests.list) || [];
    if (list.length < 2) return '';
    if (!digestSel || list.indexOf(digestSel) < 0) digestSel = list[0];
    return '<select class="select sm" id="db-dsel" title="Pick a day">' + list.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === digestSel ? ' selected' : '') + '>' +
        esc(n.replace('.md', '')) + (n === list[0] ? ' · latest' : '') + '</option>';
    }).join('') + '</select>';
  }
  function renderDigest() {
    var list = S.digests.list;
    if (!list.length) return '<div class="db-card"><div class="db-card-b"><div class="db-empty">No digest yet. The go loop writes one on its first pass at or after 5am: what happened in the last day, reflections, a design review, and a triage review.</div></div></div>';
    if (!digestSel || list.indexOf(digestSel) < 0) digestSel = list[0];
    // exactly one digest is ever in the document; the rest are one fetch away
    var cached = digestCache[digestSel];
    var h = '<div class="db-card"><div class="db-card-b"><div class="db-md" id="db-md">' +
      (cached ? md(cached) : '<p class="db-empty">Loading…</p>') + '</div></div></div>';
    if (!cached) setTimeout(function () { loadDigest(digestSel); }, 0);
    return h;
  }
  function loadDigest(name) {
    var el = document.getElementById('db-md');
    if (!el) return;
    if (digestCache[name]) { el.innerHTML = md(digestCache[name]); return; }
    fetch('/api/digest/' + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (d) {
      digestCache[name] = d.body || '';
      if (digestSel === name) {
        var cur = document.getElementById('db-md');
        if (cur) { cur.innerHTML = md(digestCache[name]); cur.classList.add('db-enter'); }
      }
    }).catch(function () {
      var cur = document.getElementById('db-md');
      if (cur) cur.innerHTML = '<p class="db-empty">That digest could not be loaded.</p>';
    });
  }
  // minimal markdown: headings, lists, bold, code, links. Digests are our own format.
  function md(src) {
    var out = [], para = [], listTag = null;
    function flushPara() { if (para.length) { out.push('<p>' + para.join(' ') + '</p>'); para = []; } }
    function closeList() { if (listTag) { out.push('</' + listTag + '>'); listTag = null; } }
    // A list item can wrap onto following indented lines; they belong to the
    // item, not to a new paragraph.
    function appendToItem(text) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, ' ' + text + '</li>'); }
    function inline(s) {
      return esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // An audit's screenshots sit beside its markdown in queue/audits/, so a
        // bare relative name resolves through the server's /audits/ route.
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, src) {
          var url = /^(https?:|\/)/.test(src) ? src : '/audits/' + src.replace(/^\.\//, '');
          return '<img src="' + url + '" alt="' + alt + '" loading="lazy">';
        })
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    String(src || '').split('\n').forEach(function (line) {
      var m;
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushPara(); closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); return; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (listTag !== 'ol') { closeList(); out.push('<ol>'); listTag = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) { flushPara(); if (listTag !== 'ul') { closeList(); out.push('<ul>'); listTag = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
      if (listTag && !para.length && /^\s+\S/.test(line)) { appendToItem(inline(line.trim())); return; }
      if (!line.trim()) { flushPara(); closeList(); return; }
      para.push(inline(line));
    });
    flushPara(); closeList();
    return out.join('\n');
  }

  // ---- actions ----
  document.getElementById('dashboard').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act], [data-dbtab], [data-tsort], [data-tfilter]');
    if (!b) return;
    if (b.dataset.dbtab) { setTab(b.dataset.dbtab, true); return; }
    if (b.dataset.tsort) {
      if (tSort.key === b.dataset.tsort) tSort.dir = -tSort.dir;
      else tSort = { key: b.dataset.tsort, dir: 1 };
      refreshTasksTable();
      return;
    }
    if (b.dataset.tfilter) {
      tFilter = b.dataset.tfilter;
      document.querySelectorAll('[data-tfilter]').forEach(function (x) { x.classList.toggle('on', x.dataset.tfilter === tFilter); });
      refreshRows();
      return;
    }
    if (b.dataset.act === 'ob-add-root' || b.dataset.act === 'ob-add-child') {
      var epic = { id: 'epic-' + Math.random().toString(36).slice(2, 8), title: 'New epic', note: '', children: [] };
      if (b.dataset.act === 'ob-add-root') obTree.push(epic);
      else { var pf = obFind(obTree, b.dataset.id); if (!pf) return; pf.node.children = pf.node.children || []; pf.node.children.push(epic); }
      obDirty = true; render();
      obStartRename(epic.id);
      return;
    }
    if (b.dataset.act === 'ob-rename') { obStartRename(b.dataset.id); return; }
    if (b.dataset.act === 'ob-delete') {
      var df = obFind(obTree, b.dataset.id);
      if (df) { df.list.splice(df.index, 1); obMarkDirty(); }
      return;
    }
    if (b.dataset.act === 'ob-save') { obSave(); return; }
    if (b.dataset.act === 'retriage') {
      b.textContent = 'Queuing…'; b.disabled = true;
      var ready = obDirty ? post('/api/objectives', { epics: obTree }).then(function () { obDirty = false; }) : Promise.resolve();
      ready.then(function () { return post('/api/retriage', {}); }).then(function () { b.textContent = 'Retriage queued'; });
      return;
    }
    if (b.dataset.act === 'decide') {
      if (decAnim) return;
      var noteEl = document.querySelector('[data-notefor="' + b.dataset.id + '/' + b.dataset.choice + '"]');
      b.textContent = 'Sending…'; b.disabled = true;
      decResolve(b.dataset.id, b.dataset.choice, noteEl ? noteEl.value : '');
      return;
    }
    if (b.dataset.act === 'dec-prev') { decStep(-1); return; }
    if (b.dataset.act === 'dec-next') { decStep(1); return; }
    // the working-detail disclosure inside the task dialog
    if (b.dataset.act === 'task-detail-notes') {
      var wrapN = b.parentNode.querySelector('.db-brief');
      if (!wrapN) return;
      var openingN = !wrapN.classList.contains('on');
      wrapN.classList.toggle('on', openingN);
      b.classList.toggle('on', openingN);
      return;
    }
    if (b.dataset.act === 'dec-brief') {
      var wrap = document.querySelector('[data-brieffor="' + b.dataset.id + '"]');
      if (!wrap) return;
      var opening = !wrap.classList.contains('on');
      wrap.classList.toggle('on', opening);
      b.classList.toggle('on', opening);
      var md0 = wrap.querySelector('.db-md');
      if (opening && !md0.innerHTML) {
        md0.innerHTML = '<p>Loading…</p>';
        fetch('/api/decision-brief/' + encodeURIComponent(b.dataset.id)).then(function (r) { return r.json(); })
          .then(function (r) { md0.innerHTML = md(r.body || 'No brief was written for this decision.'); })
          .catch(function () { md0.innerHTML = '<p>The brief could not be loaded.</p>'; });
      }
      return;
    }
    if (b.dataset.act === 'add') {
      var t = document.getElementById('db-new-title'), p = document.getElementById('db-new-prio'), n = document.getElementById('db-new-notes');
      if (!t.value.trim()) { t.focus(); return; }
      post('/api/task', { title: t.value.trim(), priority: p.value, notes: n.value.trim() });
      t.value = ''; n.value = '';
    }
    // an action taken inside the dialog closes it first, so the overlay plays
    // its exit instead of vanishing when the list re-renders underneath it
    if (b.dataset.act === 'drop') {
      var id = b.dataset.id;
      closeDetail(function () { post('/api/task/update', { id: id, status: 'dropped', note: 'dropped from the dashboard' }); });
      return;
    }
    if (b.dataset.act === 'unpark') {
      var uid = b.dataset.id;
      closeDetail(function () { post('/api/task/update', { id: uid, status: 'pending', note: 'put back in the queue from the dashboard' }); });
      return;
    }
    if (b.dataset.act === 'detail') { detailId = b.dataset.id; render(); return; }
    if (b.dataset.act === 'audit-comment') {
      commentOn = commentOn === b.dataset.anchor ? null : b.dataset.anchor;
      render();
      var ta = document.getElementById('db-ctext');
      if (ta) ta.focus();
      return;
    }
    if (b.dataset.act === 'audit-cancel') { commentOn = null; render(); return; }
    if (b.dataset.act === 'audit-send') {
      var ta2 = document.getElementById('db-ctext');
      var text = ta2 ? ta2.value.trim() : '';
      if (!text) { if (ta2) ta2.focus(); return; }
      var a = auditCache[auditSel] || {};
      var key = auditSel + '|' + b.dataset.anchor;
      b.textContent = 'Filing…'; b.disabled = true;
      post('/api/feedback', { audit: auditSel, anchor: b.dataset.anchor, quote: b.dataset.quote, text: text, epic: a.epic || '' })
        .then(function () { filed[key] = true; commentOn = null; render(); });
      return;
    }
  });
  document.getElementById('dashboard').addEventListener('change', function (e) {
    if (e.target.id === 'db-dsel') { selectDigest(e.target.value); return; }
    if (e.target.id === 'db-asel') { auditSel = e.target.value; commentOn = null; render(); return; }
    var s = e.target.closest('select[data-act="prio"]');
    if (s) { post('/api/task/update', { id: s.dataset.id, priority: s.value }); return; }
    var q2 = e.target.closest('input[data-act="seq"]');
    if (q2) {
      var v = parseFloat(q2.value);
      if (isFinite(v)) post('/api/task/update', { id: q2.dataset.id, seq: v });
      else { lastJSON = ''; load(); }
    }
  });
  // the search box filters the table body in place, so typing never loses focus
  document.getElementById('dashboard').addEventListener('input', function (e) {
    if (e.target.id === 'db-tquery') { tQuery = e.target.value; refreshRows(); }
  });

  function selectDigest(name) {
    digestSel = name;
    render();
    try { history.replaceState(null, '', digestURL(name)); } catch (err) {}
    try { parent.postMessage({ photonzDashTab: 'digest', photonzDigest: name }, '*'); } catch (err) {}
  }

  function setTab(t, push) {
    tab = t;
    render();
    if (push) {
      var url = t === 'digest' && digestSel ? digestURL(digestSel) : '?tab=' + t;
      try { history.replaceState(null, '', url); } catch (err) {}
      try { parent.postMessage({ photonzDashTab: t, photonzDigest: t === 'digest' ? digestSel : null }, '*'); } catch (err) {}
    }
  }

  // the shell switches sections in place rather than reloading this document
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.photonzSetTab) return;
    if (d.photonzDigest) digestSel = d.photonzDigest;
    setTab(d.photonzSetTab, false);
    // keep this document's own URL truthful, so reload and copy-link still work
    var url = d.photonzSetTab === 'digest' && digestSel ? digestURL(digestSel) : '?tab=' + d.photonzSetTab;
    try { history.replaceState(null, '', url); } catch (err) {}
  });

  var params = new URLSearchParams(location.search);
  var q = params.get('tab');
  if (params.get('d')) digestSel = params.get('d');
  if (q && ['summary', 'objectives', 'tasks', 'audits', 'data', 'digest'].indexOf(q) >= 0) setTab(q, false);
  load();
  setInterval(function () { if (!document.hidden) load(); }, 4000);
})();
</script>
</body>
</html>
