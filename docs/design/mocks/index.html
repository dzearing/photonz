  html,body{height:100%;margin:0;overflow:hidden}

  .nav .wip{display:inline-block;margin-left:6px;font-size:8.5px;font-weight:700;letter-spacing:.05em;color:var(--comp);background:var(--comp-soft);border:1px solid var(--comp-line);padding:1px 5px;border-radius:5px;vertical-align:1px;white-space:nowrap}

  .rail .gtoggle{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin:1px 0;padding:7px 9px;border-radius:8px;cursor:pointer}
  .rail .gtoggle:hover{background:var(--panel-2)}
  .rail .gtoggle .gchev{margin-left:auto;width:15px;height:15px;color:var(--dim);transition:transform .15s ease}
  .rail .gtoggle:hover .gchev{color:var(--ink)}
  .rail .gtoggle.collapsed .gchev{transform:rotate(-90deg)}
  .subnav{display:flex;flex-direction:column}
  .subnav.collapsed{display:none}
  .nav.sub{padding:6px 9px 6px 24px;font-size:12px}
  .themebtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:560;color:var(--dim)}
  .themebtn:hover{border-color:var(--accent-line);color:var(--ink)}
</style>

<script>
(function () {
  var frame = document.getElementById('frame');
  var navs = [].slice.call(document.querySelectorAll('.nav[data-page]'));
  var theme = null; // null = follow system
  function paintActive(id) {
    navs.forEach(function (n) { n.classList.toggle('on', n.dataset.page === id); });
  }
  function setGroup(g, collapsed) {
    document.querySelectorAll('.gtoggle[data-group="' + g + '"], .subnav[data-group="' + g + '"]')
      .forEach(function (el) { el.classList.toggle('collapsed', collapsed); });
  }
  function expandGroupFor(id) {
    var el = document.querySelector('.subnav .nav[data-page="' + id + '"]');
    if (el) setGroup(el.closest('.subnav').dataset.group, false);
  }
  function go(id) {
    if (!id) return;
    frame.src = '/pages/' + id + '.html';
    paintActive(id);
    expandGroupFor(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  navs.forEach(function (n) { n.addEventListener('click', function () { go(n.dataset.page); }); });
  document.querySelectorAll('.gtoggle').forEach(function (t) {
    t.addEventListener('click', function () { setGroup(t.dataset.group, !t.classList.contains('collapsed')); });
  });
  // pages ask to navigate via postMessage (cross-links)
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.photonzNav) go(d.photonzNav);
  });
  // theme toggle: cycle system -> dark -> light -> system, and push to the iframe
  function applyTheme() {
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    try { frame.contentWindow.postMessage({ photonzTheme: theme || '' }, '*'); } catch (e) {}
  }
  document.getElementById('theme').addEventListener('click', function () {
    theme = theme === null ? 'dark' : theme === 'dark' ? 'light' : null;
    this.textContent = theme === null ? '◐ Theme' : theme === 'dark' ? '● Dark' : '○ Light';
    applyTheme();
  });
  frame.addEventListener('load', applyTheme); // re-assert theme on each page load
  // deep link on first load
  var initial = (location.hash || '').replace('#', '');
  if (initial) { go(initial); }
  else { paintActive('app-design'); expandGroupFor('app-design'); }
})();
</script>
