<svg id="photonzIcon" xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <ellipse transform="translate(150 40)" cx="20" cy="20" rx="20" ry="20" fill="#FF3B30"/>
  <g transform="rotate(0 120 130)">
    <animateTransform attributeName="transform" type="rotate" dur="2000ms" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;1" values="0 120 130;90 120 130;90 120 130" begin="photonzIcon.mouseenter" end="photonzIcon.mouseleave" restart="whenNotActive"/>
    <rect transform="translate(60 70)" x="0" y="0" width="120" height="120" rx="24" fill="currentColor"/>
  </g>
</svg>
